<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Dirio - Ultimate Shooter</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative; width: 100%; max-width: 1024px; aspect-ratio: 256 / 240;
            background-color: #5c94fc; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        
        /* 手机端按键大幅上调、放大，释放大拇指 */
        #mobile-controls {
            position: absolute; bottom: 18%; left: 0; width: 100%; height: 50%;
            display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
        }
        .d-pad, .action-buttons { display: flex; pointer-events: auto; margin: 0 4%; gap: 15px; }
        .d-pad { align-items: flex-end; padding-bottom: 5%; }
        .action-buttons { align-items: flex-end; padding-bottom: 5%; }
        .btn {
            width: min(25vw, 95px); height: min(25vw, 95px); 
            background: rgba(255, 255, 255, 0.3); border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            color: rgba(255, 255, 255, 1); font-weight: bold; font-size: min(6vw, 24px); line-height: 1.1;
            user-select: none; -webkit-user-select: none; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
        }
        .btn small { font-size: 0.45em; display: block; font-weight: normal; margin-top: 3px; color: #ffeb3b; text-shadow: 1px 1px 0 #000; }
        .btn.pressed { background: rgba(255, 255, 255, 0.7); transform: scale(0.92); box-shadow: 0 2px 5px rgba(0,0,0,0.4); }

        #ui-layer {
            position: absolute; top: 5px; left: 5px; right: 5px; color: white;
            font-weight: bold; display: flex; justify-content: space-between;
            font-size: clamp(10px, 3vw, 24px); text-shadow: 2px 2px 0 #000; pointer-events: none;
        }

        @media (hover: hover) and (pointer: fine) { #mobile-controls { display: none; } }
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; cursor: pointer; text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="256" height="240"></canvas>
    
    <div id="ui-layer">
        <div>DIRIO<br><span id="score">000000</span></div>
        <div>COINS<br><span id="coins">0000</span></div>
        <div>WORLD<br>Endless</div>
        <div>SURVIVE<br><span id="time">000</span></div>
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-down">▼<br><small>钻管</small></div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="action-buttons">
            <div class="btn" id="btn-b">B<br><small>跑/射击</small></div>
            <div class="btn" id="btn-a">A<br><small>跳跃</small></div>
        </div>
    </div>
    
    <div id="start-screen">
        <h1 style="color: #ffcccc; text-shadow: 3px 3px 0 #f00; font-size: 2em;">SUPER DIRIO: ULTIMATE</h1>
        <p>点击或按空格键开始</p>
        <p style="font-size: 0.8em; margin-top: 20px; line-height: 1.5;">
            键盘：WASD移动，K/X/空格跳跃，J/Z加速/开火<br>
            触屏：使用底部超大虚拟按键操作
        </p>
        <p style="font-size: 0.85em; color: #ffeb3b; font-weight: bold; margin-top: 15px;">★ 收集满 1000 金币，在金色管道按【下】开启枪战！</p>
    </div>
</div>

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playSound(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'jump') {
            osc.type = 'square'; osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now);
            osc.frequency.setValueAtTime(1500, now + 0.05);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'stomp') {
            osc.type = 'square'; osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'bump') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'powerup') {
            osc.type = 'square'; osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.5);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'pipe') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(300, now + 0.1); osc.frequency.setValueAtTime(200, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'shoot') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'death') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 1);
            osc.start(now); osc.stop(now + 1);
        } else if (type === 'kick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'star') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    } catch(e){}
}

};

function buildSprite(ascii, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const xCtx = c.getContext('2d'); const lines = ascii.trim().split('\n');
    for (let y = 0; y < h; y++) {
        let row = lines[y] ? lines[y].trim() : '';
        for (let x = 0; x < w; x++) {
            let char = row[x] || 'T';
            if (char !== 'T' && char !== '.') { xCtx.fillStyle = C[char]; xCtx.fillRect(x, y, 1, 1); }
        }
    }
    return c;
}

const WEAPONS = [
    { name: 'Pistol', speed: 6, dmg: 10, cooldown: 20, color: '#ffffff', w: 4, h: 4 },
    { name: 'Shotgun', speed: 5, dmg: 8, cooldown: 35, color: '#ffff00', w: 3, h: 3 },
    { name: 'Sniper', speed: 12, dmg: 25, cooldown: 45, color: '#00ffff', w: 8, h: 2 },
    { name: 'Rocket', speed: 3, dmg: 35, cooldown: 65, color: '#ff0000', w: 6, h: 6 }
];

const Input = { left: false, right: false, up: false, down: false, jump: false, run: false, jumpPressed: false };

document.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') Input.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') Input.right = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') Input.down = true;
    if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'KeyX') { if (!Input.jump) Input.jumpPressed = true; Input.jump = true; }
    if (e.code === 'KeyJ' || e.code === 'KeyZ' || e.shiftKey) Input.run = true;
});
document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') Input.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') Input.right = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') Input.down = false;
    if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'KeyX') Input.jump = false;
    if (e.code === 'KeyJ' || e.code === 'KeyZ' || e.shiftKey) Input.run = false;
});

function bindTouch(id, keyField, isJump=false) {
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        if(isJump && !Input[keyField]) Input.jumpPressed = true;
        Input[keyField] = true; el.classList.add('pressed');
    }, {passive: false});
    el.addEventListener('touchend', (e) => {
        e.preventDefault(); Input[keyField] = false; el.classList.remove('pressed');
    }, {passive: false});
}
bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right'); bindTouch('btn-down', 'down');
bindTouch('btn-a', 'jump', true); bindTouch('btn-b', 'run');

class Game {
    constructor() {
        this.reset();
        this.scoreDisplay = document.getElementById('score');
        this.coinsDisplay = document.getElementById('coins');
        this.timeDisplay = document.getElementById('time');
    }

    reset() {
        this.mode = 'main'; 
        this.cameraX = 0;
        this.frames = 0; 
        
        this.entities = []; this.particles = []; this.projectiles = [];
        this.player = new Player(32, 60);
        this.entities.push(this.player);
        this.map = new InfiniteMap(this);
        this.maxDist = 0;
        this.deathTimer = 0; 
        this.savedMainState = null;
    }

    enterMiniGame() {
        this.savedMainState = {
            cameraX: this.cameraX,
            playerX: this.player.x,
            playerY: this.player.y,
            isBig: this.player.isBig,
            starTimer: this.player.starTimer
        };

        this.mode = 'shootout';
        this.cameraX = 0;
        this.player.x = 20; this.player.y = 180;
        this.player.isBig = false; this.player.h = 16; 
        this.player.hp = 100;
        this.player.ammo = 15;
        this.player.shootCooldown = 0;
        this.player.facingRight = true;
        this.player.gunDeck = Array.from({length:15}, () => WEAPONS[Math.floor(Math.random()*WEAPONS.length)]);
        
        this.boss = new BossTurtle(200, 176);
        this.entities = [this.player, this.boss];
        this.projectiles = [];
        this.particles = [];
        this.shootoutArena = new ShootoutArena(this);
        
        this.miniGameEnding = false;
        this.exitTimer = 0;
    }

    exitMiniGame(win) {
        this.mode = 'main';
        if (win) { globalScore += 5000; this.addCoin(2000, this.player.x, this.player.y); playSound('powerup'); }
        else { playSound('pipe'); }
        
        let s = this.savedMainState;
        
        // 【核心机制：远距离传送】将相机强制向后推进 150 个方块！
        this.cameraX = s.cameraX + (150 * TILE_SIZE);
        
        // 强制清空旧地图并初始化新生成点，杜绝卡死
        this.map.columns = [];
        this.map.bgColumns = [];
        this.map.lastGenX = Math.floor(this.cameraX / TILE_SIZE);
        
        // 强制地图的下一块立刻生成一个“金色出口管道”
        this.map.state = 'exit_pipe_start';
        this.map.stateTimer = 2;
        this.map.updateGeneration(this.cameraX);

        // 从新生成的管子口弹射而出
        this.player.isBig = s.isBig;
        this.player.h = s.isBig ? 32 : 16;
        this.player.starTimer = s.starTimer;
        
        this.player.x = this.map.lastGenX * TILE_SIZE - 2 * TILE_SIZE + 2; 
        this.player.y = (this.map.groundY - 1) * TILE_SIZE; 
        this.player.vx = 0; 
        this.player.vy = -7; 
        this.player.state = 'jump';
        this.player.isDeadState = false; 
        this.deathTimer = 0;
        
        this.entities = [this.player]; 
        this.projectiles = [];
        this.miniGameEnding = false;
        this.savedMainState = null;
    }

    fireWeapon(entity, isPlayer) {
        if (entity.ammo <= 0) return;
        let gun = entity.gunDeck[15 - entity.ammo];
        let dir = entity.facingRight ? 1 : -1;
        let spawnX = entity.facingRight ? entity.x + entity.w : entity.x - gun.w;
        let spawnY = entity.y + entity.h/2 - gun.h/2;
        
        if (gun.name === 'Shotgun') {
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, -1.5, gun, isPlayer));
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, 0, gun, isPlayer));
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, 1.5, gun, isPlayer));
        } else {
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, 0, gun, isPlayer));
        }
        entity.ammo--;
        entity.shootCooldown = gun.cooldown;
        playSound('shoot');
    }

    update() {
        // 【核心修复】安全阻隔死亡逻辑，确保返回阻止后续代码执行！
        if (this.player.isDeadState) {
            if (this.deathTimer > 0) {
                this.deathTimer--;
                if (this.deathTimer <= 0) {
                    if (this.mode === 'shootout') {
                        this.exitMiniGame(false);
                        return; 
                    } else {
                        this.reset();
                        return; 
                    }
                }
            }
        }

        this.frames++; 
        if (this.frames % 60 === 0 && this.mode === 'main') globalTime++;

        let currentMap = this.mode === 'shootout' ? this.shootoutArena : this.map;

        if (this.mode === 'main') {
            this.map.updateGeneration(this.cameraX);
            let currentDist = Math.max(0, Math.floor(this.player.x / 10));
            if (currentDist > this.maxDist) { globalScore += (currentDist - this.maxDist); this.maxDist = currentDist; }
        }

        for (let i = this.entities.length - 1; i >= 0; i--) {
            let e = this.entities[i]; e.update(currentMap, this.entities);
            if (e.dead) this.entities.splice(i, 1);
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i]; p.update();
            if (p.dead) this.particles.splice(i, 1);
        }

        if (this.mode === 'shootout') {
            if (this.player.shootCooldown > 0) this.player.shootCooldown--;
            if (Input.run && this.player.shootCooldown <= 0 && this.player.ammo > 0 && !this.miniGameEnding && !this.player.isDeadState) {
                this.fireWeapon(this.player, true);
            }
            if (this.player.x < 16) this.player.x = 16;
            if (this.player.x > 120) this.player.x = 120; 

            if (this.boss && !this.boss.isDeadState && !this.miniGameEnding) {
                if (this.boss.shootCooldown > 0) this.boss.shootCooldown--;
                if (this.boss.shootCooldown <= 0 && this.boss.ammo > 0) {
                    if (Math.random() < 0.05) this.fireWeapon(this.boss, false);
                }
            }

            for (let i = this.projectiles.length - 1; i >= 0; i--) {
                let p = this.projectiles[i]; p.update();
                if (!p.isPlayer && this.player.intersects(p) && !this.player.isDeadState) {
                    this.player.hp -= p.weapon.dmg; this.projectiles.splice(i, 1);
                    this.particles.push(new ScoreParticle(this.player.x, this.player.y, `-${p.weapon.dmg}`, '#ff0000'));
                    playSound('bump'); 
                }
                else if (p.isPlayer && this.boss && !this.boss.isDeadState && this.boss.intersects(p)) {
                    this.boss.hp -= p.weapon.dmg; this.projectiles.splice(i, 1);
                    this.particles.push(new ScoreParticle(this.boss.x, this.boss.y, `-${p.weapon.dmg}`, '#ffff00'));
                    playSound('bump'); 
                }
                if (p.dead) this.projectiles.splice(i, 1);
            }

            if (!this.miniGameEnding) {
                if (this.player.hp <= 0 && !this.player.isDeadState) {
                    this.player.die(); 
                    this.miniGameEnding = true;
                }
                else if (this.boss.hp <= 0 && !this.boss.isDeadState) { 
                    this.boss.die(); 
                    this.miniGameEnding = true; 
                    this.exitTimer = 120; 
                }
                else if (this.player.ammo === 0 && this.boss.ammo === 0 && this.projectiles.length === 0) {
                    this.miniGameEnding = true; this.exitTimer = 120;
                }
            } else {
                if (this.boss.isDeadState && this.exitTimer > 0) {
                    this.exitTimer--;
                    if (this.exitTimer <= 0) {
                        this.exitMiniGame(true);
                        return; // 安全退出当前帧
                    }
                } else if (!this.player.isDeadState && this.exitTimer > 0) {
                    this.exitTimer--;
                    if (this.exitTimer <= 0) {
                        this.exitMiniGame(false);
                        return; // 安全退出当前帧
                    }
                }
            }
        } else {
            if (this.player.x > this.cameraX + canvas.width / 2) this.cameraX = this.player.x - canvas.width / 2;
            if (this.player.x < this.cameraX) { this.player.x = this.cameraX; this.player.vx = 0; }
            if (this.player.y > canvas.height + 32 && !this.player.isDeadState) this.player.die();
        }

        this.scoreDisplay.innerText = globalScore.toString().padStart(6, '0');
        this.coinsDisplay.innerText = globalCoins.toString().padStart(4, '0');
        this.timeDisplay.innerText = globalTime.toString().padStart(3, '0');
    }

    draw() {
        ctx.fillStyle = this.mode === 'shootout' ? '#222' : '#5c94fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(-Math.floor(this.cameraX), 0);
        
        if (this.mode === 'shootout') {
            this.shootoutArena.draw(ctx, this.cameraX);
            this.entities.forEach(e => { if(e !== this.player) e.draw(ctx) });
            this.player.draw(ctx);
            this.projectiles.forEach(p => p.draw(ctx));
        } else {
            this.map.drawBg(ctx, this.cameraX);
            if (this.player.state === 'enter_pipe') {
                this.entities.forEach(e => { if(e !== this.player) e.draw(ctx) });
                this.player.draw(ctx);
                this.map.draw(ctx, this.cameraX);
            } else {
                this.map.draw(ctx, this.cameraX);
                this.entities.forEach(e => { if(e !== this.player) e.draw(ctx) });
                this.player.draw(ctx);
            }
        }
        
        this.particles.forEach(p => p.draw(ctx));
        ctx.restore();

        if (this.mode === 'shootout') {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,256,42);
            ctx.fillStyle = 'white'; ctx.font = 'bold 10px Courier New';
            ctx.fillText(`P1 HP:${Math.max(0, this.player.hp)}`, 5, 12);
            let pGun = this.player.ammo > 0 ? this.player.gunDeck[15 - this.player.ammo] : null;
            ctx.fillStyle = pGun ? pGun.color : 'gray';
            ctx.fillText(`[${pGun ? pGun.name : 'EMPTY'} x${this.player.ammo}]`, 5, 24);
            ctx.fillStyle = '#ffeb3b'; ctx.fillText(`PRESS B TO SHOOT`, 5, 36);
            
            ctx.fillStyle = 'white';
            ctx.fillText(`BOSS HP:${Math.max(0, this.boss ? this.boss.hp : 0)}`, 140, 12);
            let bGun = (this.boss && this.boss.ammo > 0) ? this.boss.gunDeck[15 - this.boss.ammo] : null;
            ctx.fillStyle = bGun ? bGun.color : 'gray';
            ctx.fillText(`[${bGun ? bGun.name : 'EMPTY'} x${this.boss ? this.boss.ammo : 0}]`, 140, 24);
        }
    }

    // 更新！统一使用 addCoin 并在画面浮现黄色金额数字
    addScore(val, x, y) { globalScore += val; this.particles.push(new ScoreParticle(x, y, val.toString())); }
    addCoin(amount, x, y, playCoinSound=true) { 
        globalCoins += amount; 
        this.particles.push(new ScoreParticle(x, y, `+${amount}`, '#f8d820')); 
        if(playCoinSound) playSound('coin'); 
    }
}

class Projectile {
    constructor(x, y, vx, vy, weapon, isPlayer) {
        this.x = x; this.y = y; this.w = weapon.w; this.h = weapon.h;
        this.vx = vx; this.vy = vy; this.weapon = weapon; this.isPlayer = isPlayer;
        this.dead = false;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > 256 || this.y < 0 || this.y > 240) this.dead = true;
    }
    draw(ctx) { ctx.fillStyle = this.weapon.color; ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.w, this.h); }
}

class Entity {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.vx = 0; this.vy = 0; this.dead = false; this.onGround = false;
        this.type = 'none'; this.facingRight = true;
    }
    applyPhysics(map) {
        this.vy += GRAVITY; if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
        this.y += this.vy; this.onGround = false;
        let yTiles = map.getIntersectingTiles({ x: this.x + 2, y: this.y, w: this.w - 4, h: this.h });
        for (let t of yTiles) {
            if (t.solid) {
                if (this.vy > 0) { this.y = t.y * TILE_SIZE - this.h; this.vy = 0; this.onGround = true; }
                else if (this.vy < 0) { this.y = t.y * TILE_SIZE + TILE_SIZE; this.vy = 0; this.onCeilingHit(t, map); }
                break; 
            }
        }
        this.x += this.vx;
        let xTiles = map.getIntersectingTiles({ x: this.x, y: this.y + 2, w: this.w, h: this.h - 4 });
        for (let t of xTiles) {
            if (t.solid) {
                let oldVx = this.vx; 
                if (this.vx > 0) { this.x = t.x * TILE_SIZE - this.w; this.vx = 0; }
                else if (this.vx < 0) { this.x = t.x * TILE_SIZE + TILE_SIZE; this.vx = 0; }
                this.onWallHit(t, oldVx); break;
            }
        }
    }
    onWallHit(tile, oldVx) {} onCeilingHit(tile, map) {}
    intersects(other) {
        return this.x < other.x + other.w && this.x + this.w > other.x && this.y < other.y + other.h && this.y + this.h > other.y;
    }
    dieFromStar() { this.state = 'star_dead'; this.vy = -3; this.vx = this.facingRight ? -1 : 1; playSound('kick'); }
}

class Player extends Entity {
    constructor(x, y) {
        super(x, y, 12, 16); this.type = 'player';
        this.isBig = false; this.isDeadState = false;
        this.jumpTimer = 0; this.invincibleTimer = 0; this.animTimer = 0;
        this.state = 'idle'; this.skidding = false; this.jumpBuffer = 0;
        this.pipeTimer = 0; this.starTimer = 0; this.coinRejectTimer = 0;
    }

    update(map, entities) {
        if (this.state === 'enter_pipe') {
            this.y += 0.5; this.pipeTimer--;
            if (this.pipeTimer <= 0) { this.state = 'idle'; game.enterMiniGame(); }
            return;
        }
        if (this.isDeadState) { this.vy += GRAVITY; this.y += this.vy; return; }
        
        // 钻金色管道与门票检测
        if (game.mode === 'main' && Input.down && this.onGround) {
            let centerCol = Math.floor((this.x + this.w / 2) / TILE_SIZE);
            let footRow = Math.floor((this.y + this.h + 1) / TILE_SIZE);
            let tile = map.columns && map.columns[centerCol] ? map.columns[centerCol][footRow] : null;
            if (tile && (tile.type === 'gPipeTL' || tile.type === 'gPipeTR')) {
                // 扣钱门票机制
                if (globalCoins >= 1000) {
                    globalCoins -= 1000;
                    this.state = 'enter_pipe'; this.pipeTimer = 60; this.vx = 0; this.vy = 0;
                    let pipeLeftX = (centerCol * TILE_SIZE) + (tile.type === 'gPipeTL' ? 0 : -TILE_SIZE);
                    this.x = pipeLeftX + 2; playSound('pipe'); 
                } else {
                    if (this.coinRejectTimer <= 0) {
                        game.particles.push(new ScoreParticle(this.x, this.y - 10, "NEED 1000 COINS!", "red"));
                        this.coinRejectTimer = 60;
                        playSound('bump');
                    }
                }
                return;
            }
        }
        if (this.coinRejectTimer > 0) this.coinRejectTimer--;

        if (this.invincibleTimer > 0) this.invincibleTimer--;
        if (this.starTimer > 0) {
            this.starTimer--;
            if (this.starTimer % 20 === 0 && this.starTimer > 60) playSound('star');
        }
        
        let maxSpd = Input.run || this.starTimer > 0 ? MAX_RUN_SPEED + 0.5 : MAX_WALK_SPEED;
        let accel = this.onGround ? MOVE_ACCEL : AIR_ACCEL;
        let friction = this.onGround ? MOVE_FRICTION : AIR_FRICTION;
        this.skidding = false;

        if (Input.left) {
            if (this.vx > 0 && this.onGround) this.skidding = true; 
            this.vx -= accel; this.facingRight = false;
        } else if (Input.right) {
            if (this.vx < 0 && this.onGround) this.skidding = true; 
            this.vx += accel; this.facingRight = true;
        } else { this.vx *= friction; }
        
        if (this.vx > maxSpd) this.vx = maxSpd; if (this.vx < -maxSpd) this.vx = -maxSpd;
        if (Math.abs(this.vx) < 0.1 && !Input.left && !Input.right) this.vx = 0;

        if (Input.jumpPressed) { this.jumpBuffer = 6; Input.jumpPressed = false; }
        if (this.jumpBuffer > 0) {
            if (this.onGround) { this.vy = JUMP_SPEED; this.onGround = false; this.jumpTimer = 1; this.jumpBuffer = 0; playSound('jump'); }
            else { this.jumpBuffer--; }
        }
        if (Input.jump && this.jumpTimer > 0 && this.jumpTimer < 15) { this.vy -= 0.15; this.jumpTimer++; }
        else if (!Input.jump) { this.jumpTimer = 0; }

        this.applyPhysics(map);

        if (game.mode === 'main') {
            for (let e of entities) {
                if (e === this || e.dead || e.state === 'star_dead' || e.state === 'squished') continue;
                if (this.intersects(e)) {
                    if (e.type === 'coin_item') {
                        e.dead = true; game.addCoin(100, e.x, e.y, true);
                    } else if (e.type === 'mushroom') {
                        e.dead = true; game.addCoin(200, e.x, e.y, false); playSound('powerup');
                        if (!this.isBig) { this.isBig = true; this.y -= 16; this.h = 32; }
                    } else if (e.type === 'star') {
                        e.dead = true; game.addCoin(300, e.x, e.y, false); playSound('powerup');
                        this.starTimer = 600; 
                    } else if (e.type === 'goomba' || e.type === 'bird' || e.type === 'koopa') {
                        if (this.starTimer > 0) {
                            e.dieFromStar(); game.addCoin(200, e.x, e.y, false);
                        } else if (e.type === 'koopa' && e.state === 'shell_idle') {
                            e.state = 'shell_slide'; e.vx = this.x < e.x ? 3.5 : -3.5;
                            playSound('kick'); this.invincibleTimer = 10;
                        } else if (this.vy > 0 && this.y + this.h <= e.y + 12) {
                            e.squish(); this.vy = Input.jump ? -4.8 : -3;
                            game.addCoin(100, e.x, e.y, false); playSound('stomp');
                        } else if (this.invincibleTimer <= 0) {
                            this.takeDamage();
                        }
                    }
                }
            }
        }

        if (!this.onGround) this.state = 'jump';
        else if (Math.abs(this.vx) > 0.1) { this.state = this.skidding ? 'skid' : 'run'; this.animTimer += Math.abs(this.vx) * 0.3; }
        else this.state = 'idle';
    }

    onCeilingHit(tile, map) {
        this.jumpTimer = 0; if (game.mode === 'main' && (tile.type === 'qblock' || tile.type === 'brick')) map.hitBlock(tile.x, tile.y, this.isBig);
    }

    takeDamage() {
        if (this.isBig) { this.isBig = false; this.h = 16; this.y += 16; this.invincibleTimer = 60; playSound('bump'); }
        else { this.die(); }
    }

    die() {
        if (this.isDeadState) return;
        this.isDeadState = true; this.vy = -5; this.vx = 0; this.state = 'dead';
        playSound('death'); 
        
        if (game.mode === 'shootout') {
            game.deathTimer = 90; 
        } else {
            game.deathTimer = 120; 
        }
    }

    draw(ctx) {
        if (this.invincibleTimer > 0 && Math.floor(Date.now() / 50) % 2 === 0) return;
        let sprite = Sprites.marioIdle;
        if (this.state === 'dead') sprite = Sprites.marioDead;
        else if (this.state === 'jump') sprite = Sprites.marioJump;
        else if (this.state === 'skid') sprite = Sprites.marioSkid;
        else if (this.state === 'run') {
            let f = Math.floor(this.animTimer) % 3; sprite = f === 0 ? Sprites.marioRun1 : (f === 1 ? Sprites.marioRun2 : Sprites.marioRun3);
        }
        ctx.save(); ctx.translate(Math.floor(this.x + this.w / 2), Math.floor(this.y));
        let displayFacingRight = this.skidding ? !this.facingRight : this.facingRight;
        if (!displayFacingRight) ctx.scale(-1, 1);
        if (this.starTimer > 0) ctx.filter = `hue-rotate(${(game.frames * 20) % 360}deg) saturate(200%)`;
        if (this.isBig) { ctx.scale(1, 2); ctx.drawImage(sprite, -8, 0); } else { ctx.drawImage(sprite, -8, 0); }
        ctx.restore();
    }
}

class BossTurtle extends Entity {
    constructor(x, y) {
        super(x, y, 32, 32); this.type = 'boss';
        this.hp = 150; this.ammo = 15;
        this.gunDeck = Array.from({length:15}, () => WEAPONS[Math.floor(Math.random()*WEAPONS.length)]);
        this.shootCooldown = 60;
        this.isDeadState = false;
    }
    update(map) {
        if (this.isDeadState) { this.vy += GRAVITY; this.y += this.vy; return; }
        this.applyPhysics(map);
        if (this.x > 200) this.vx = -1; else if (this.x < 50) this.vx = 1;
        else if (Math.random() < 0.03) this.vx = Math.random() > 0.5 ? 1 : -1;
        if (game.player) { this.facingRight = game.player.x > this.x; }
        if (Math.random() < 0.02 && this.onGround) { this.vy = -5.5; }
    }
    die() { this.isDeadState = true; this.vy = -5; this.vx = 0; playSound('kick'); }
    draw(ctx) {
        ctx.save(); ctx.translate(Math.floor(this.x + this.w / 2), Math.floor(this.y));
        ctx.scale(this.facingRight ? 2 : -2, 2); 
        ctx.drawImage(Sprites.bossTurtle, -8, 0); ctx.restore();
    }
}

class Goomba extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'goomba'; this.vx = -0.5; this.animTimer = 0; this.state = 'walk'; }
    update(map) {
        if (this.state === 'star_dead') { this.vy += GRAVITY; this.y += this.vy; this.x += this.vx; if (this.y > 240) this.dead = true; return; }
        if (this.state === 'squished') { this.deathTimer--; if (this.deathTimer <= 0) this.dead = true; return; }
        this.applyPhysics(map); this.animTimer += 0.1;
        if (this.x < game.cameraX - 64) this.dead = true; 
    }
    onWallHit(tile, oldVx) { this.vx = oldVx > 0 ? -0.5 : 0.5; }
    squish() { this.state = 'squished'; this.vx = 0; this.deathTimer = 30; }
    draw(ctx) {
        let sp = Sprites.goomba1;
        if (this.state === 'squished') sp = Sprites.goombaSquished;
        else if (Math.floor(this.animTimer) % 2 === 0) sp = Sprites.goomba2;
        ctx.save(); ctx.translate(this.x+8, this.y+8);
        if (this.state === 'star_dead') ctx.scale(1, -1);
        ctx.drawImage(sp, -8, -8); ctx.restore();
    }
}

class Koopa extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'koopa'; this.vx = -0.5; this.animTimer = 0; this.state = 'walk'; }
    update(map, entities) {
        if (this.state === 'star_dead') { this.vy += GRAVITY; this.y += this.vy; this.x += this.vx; if (this.y > 240) this.dead = true; return; }
        this.applyPhysics(map); this.animTimer += 0.1;
        if (this.state === 'shell_slide') {
            for (let e of entities) {
                if (e === this || e.dead || e.type === 'player' || e.type === 'coin_item' || e.type === 'mushroom' || e.type === 'star') continue;
                if (this.intersects(e)) { e.dieFromStar(); game.addCoin(200, e.x, e.y, false); }
            }
        }
        if (this.x < game.cameraX - 64) this.dead = true; 
    }
    onWallHit(tile, oldVx) { 
        if (this.state === 'shell_slide') { this.vx = oldVx > 0 ? -3.5 : 3.5; playSound('bump'); } 
        else { this.vx = oldVx > 0 ? -0.5 : 0.5; this.facingRight = this.vx > 0; }
    }
    squish() { if (this.state === 'walk' || this.state === 'shell_slide') { this.state = 'shell_idle'; this.vx = 0; } }
    draw(ctx) {
        let sp = Sprites.koopa1;
        if (this.state === 'shell_idle' || this.state === 'shell_slide') sp = Sprites.shell;
        else if (Math.floor(this.animTimer) % 2 === 0) sp = Sprites.koopa2;
        ctx.save(); ctx.translate(this.x+8, this.y+8);
        if (this.state === 'star_dead') ctx.scale(1, -1);
        else if (this.state === 'walk' && this.vx > 0) ctx.scale(-1, 1);
        ctx.drawImage(sp, -8, -8); ctx.restore();
    }
}

class Bird extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'bird'; this.vx = -1.8; this.vy = 0; this.animTimer = 0; this.state = 'fly'; }
    update(map) {
        if (this.state === 'squished' || this.state === 'star_dead') {
            this.vy += GRAVITY; this.y += this.vy; this.x += this.state === 'star_dead' ? this.vx : 0;
            if (this.y > 240) this.dead = true; return;
        }
        this.x += this.vx; this.animTimer += 0.1;
        if (this.x < game.cameraX - 100) this.dead = true; 
    }
    squish() { this.state = 'squished'; this.vy = -1; this.vx = 0; }
    draw(ctx) {
        let sp = (Math.floor(this.animTimer) % 2 === 0) ? Sprites.bird1 : Sprites.bird2;
        ctx.save(); ctx.translate(this.x + 8, this.y + 8);
        if (this.state === 'squished' || this.state === 'star_dead') ctx.scale(1, -1); 
        ctx.drawImage(sp, -8, -8); ctx.restore();
    }
}

class Mushroom extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'mushroom'; this.vx = 1; this.spawning = true; this.spawnY = y - 16; this.vy = -0.5; }
    update(map) {
        if (this.spawning) { this.y += this.vy; if (this.y <= this.spawnY) { this.y = this.spawnY; this.spawning = false; this.vy = 0; } return; }
        this.applyPhysics(map);
    }
    onWallHit(tile, oldVx) { this.vx = oldVx > 0 ? -1 : 1; }
    draw(ctx) { ctx.drawImage(Sprites.mushroom, this.x, this.y); }
}

class Star extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'star'; this.vx = 1.5; this.spawning = true; this.spawnY = y - 16; this.vy = -1; }
    update(map) {
        if (this.spawning) { this.y += this.vy; if (this.y <= this.spawnY) { this.y = this.spawnY; this.spawning = false; this.vy = 0; } return; }
        this.applyPhysics(map);
    }
    onWallHit(tile, oldVx) { this.vx = oldVx > 0 ? -1.5 : 1.5; }
    onCeilingHit() { this.vy = 0; }
    applyPhysics(map) {
        this.vy += GRAVITY; if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
        this.y += this.vy; this.onGround = false;
        let yTiles = map.getIntersectingTiles({ x: this.x + 2, y: this.y, w: this.w - 4, h: this.h });
        for (let t of yTiles) {
            if (t.solid) {
                if (this.vy > 0) { this.y = t.y * TILE_SIZE - this.h; this.vy = -4.5; } 
                else if (this.vy < 0) { this.y = t.y * TILE_SIZE + TILE_SIZE; this.vy = 0; } break; 
            }
        }
        this.x += this.vx;
        let xTiles = map.getIntersectingTiles({ x: this.x, y: this.y + 2, w: this.w, h: this.h - 4 });
        for (let t of xTiles) {
            if (t.solid) {
                let oldVx = this.vx; 
                if (this.vx > 0) { this.x = t.x * TILE_SIZE - this.w; this.vx = 0; }
                else if (this.vx < 0) { this.x = t.x * TILE_SIZE + TILE_SIZE; this.vx = 0; }
                this.onWallHit(t, oldVx); break;
            }
        }
    }
    draw(ctx) { ctx.save(); ctx.filter = `hue-rotate(${Date.now() % 360}deg)`; ctx.drawImage(Sprites.star, this.x, this.y); ctx.restore(); }
}

class CoinItem extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'coin_item'; this.animTimer = 0; }
    update() { this.animTimer += 0.1; }
    draw(ctx) { ctx.save(); ctx.translate(this.x + 8, this.y + 8); ctx.scale(Math.abs(Math.sin(this.animTimer)), 1); ctx.drawImage(Sprites.coin, -8, -8); ctx.restore(); }
}

class ScoreParticle {
    constructor(x, y, text, color = 'white') { this.x = x; this.y = y; this.text = text; this.color = color; this.vy = -2; this.life = 40; }
    update() { this.y += this.vy; this.life--; if (this.life <= 0) this.dead = true; }
    draw(ctx) { ctx.fillStyle = this.color; ctx.font = 'bold 10px Courier New'; ctx.fillText(this.text, this.x, this.y); }
}
class BrickDebris {
    constructor(x, y, vx, vy) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.life = 60; }
    update() { this.vy += GRAVITY; this.x += this.vx; this.y += this.vy; this.life--; if (this.life <= 0) this.dead = true; }
    draw(ctx) { ctx.fillStyle = '#c84c0c'; ctx.fillRect(this.x, this.y, 8, 8); }
}

class ShootoutArena {
    constructor(gameInst) {
        this.game = gameInst; this.rows = 15; this.columns = [];
        for(let x=0; x<16; x++) {
            let col = new Array(this.rows).fill(null);
            col[13] = { x, y: 13, type: 'usedblock', solid: true, bounceY: 0 };
            col[14] = { x, y: 14, type: 'usedblock', solid: true, bounceY: 0 };
            if (x===0 || x===15) { for(let y=0; y<15; y++) col[y] = { x, y, type: 'usedblock', solid: true, bounceY: 0 }; }
            this.columns[x] = col;
        }
    }
    getIntersectingTiles(rect, shrinkX=0, shrinkY=0) {
        let tiles = [];
        let startX = Math.max(0, Math.floor((rect.x + shrinkX) / TILE_SIZE));
        let endX = Math.min(15, Math.floor((rect.x + rect.w - shrinkX - 0.001) / TILE_SIZE));
        let startY = Math.max(0, Math.floor((rect.y + shrinkY) / TILE_SIZE));
        let endY = Math.min(this.rows - 1, Math.floor((rect.y + rect.h - shrinkY - 0.001) / TILE_SIZE));
        for (let x = startX; x <= endX; x++) {
            if (!this.columns[x]) continue;
            for (let y = startY; y <= endY; y++) if (this.columns[x][y]) tiles.push(this.columns[x][y]);
        }
        return tiles;
    }
    draw(ctx, cameraX) {
        for (let x = 0; x <= 15; x++) {
            if (!this.columns[x]) continue;
            for (let y = 0; y < this.rows; y++) {
                if (this.columns[x][y]) ctx.drawImage(Sprites.usedBlock, x * TILE_SIZE, y * TILE_SIZE);
            }
        }
    }
}

class InfiniteMap {
    constructor(gameInst) {
        this.game = gameInst; this.columns = []; this.bgColumns = []; this.rows = 15;
        this.animTimer = 0; this.lastGenX = 0; this.state = 'safe_zone'; this.stateTimer = 20; 
        this.groundY = 11; this.pipeHeight = 2; this.blocksSpawned = 0; this.isGoldenPipe = false;
    }
    buildPipe(col, x, isLeft) {
        let topY = this.groundY - this.pipeHeight;
        let pTL = this.isGoldenPipe ? 'gPipeTL' : 'pipeTL'; let pTR = this.isGoldenPipe ? 'gPipeTR' : 'pipeTR';
        let pL = this.isGoldenPipe ? 'gPipeL' : 'pipeL'; let pR = this.isGoldenPipe ? 'gPipeR' : 'pipeR';
        col[topY] = { x, y: topY, type: isLeft ? pTL : pTR, solid: true, bounceY: 0 };
        for (let py = topY + 1; py < this.groundY; py++) col[py] = { x, y: py, type: isLeft ? pL : pR, solid: true, bounceY: 0 };
    }
    generateColumn() {
        let x = this.lastGenX++; let col = new Array(this.rows).fill(null); let bgCol = new Array(this.rows).fill(null);
        if (Math.random() < 0.05) bgCol[Math.floor(Math.random() * 4) + 1] = 'cloud';
        
        // 远距离跳跃后，强制生成一根单边孤立金色管子弹出马里奥
        if (this.state === 'exit_pipe_start') {
            this.buildGround(col, x, this.groundY); this.pipeHeight = 2; this.isGoldenPipe = true;
            this.buildPipe(col, x, this.stateTimer === 2); this.stateTimer--;
            if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = 10; } 
        }
        else if (this.state === 'safe_zone') {
            this.buildGround(col, x, this.groundY); this.stateTimer--;
            if (this.stateTimer === 10) col[6] = { x, y: 6, type: 'qblock', solid: true, bounceY: 0, item: 'mushroom' };
            if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = 5; }
        } else if (this.state === 'ground') {
            this.buildGround(col, x, this.groundY); this.stateTimer--;
            if (Math.random() < 0.25) {
                let by = Math.random() < 0.5 ? 6 : 2;  let type = Math.random() < 0.4 ? 'qblock' : 'brick';
                let item = null;
                if (type === 'qblock') {
                    this.blocksSpawned++;
                    if (this.blocksSpawned < 3 && Math.random() < 0.5) item = 'mushroom';
                    else item = Math.random() < 0.5 ? 'coin' : null;
                }
                col[by] = { x, y: by, type, solid: true, bounceY: 0, item };
            }
            if (this.stateTimer <= 0) {
                let r = Math.random();
                if (r < 0.15) { this.state = 'pit'; this.stateTimer = Math.floor(Math.random() * 3) + 2; }
                else if (r < 0.35) { 
                    this.state = 'pipe_start'; this.stateTimer = 2; 
                    this.pipeHeight = Math.floor(Math.random() * 3) + 2; 
                    this.isGoldenPipe = false;
                }
                else if (r < 0.45) {
                    this.state = 'gold_pipe_start'; this.stateTimer = 2; this.pipeHeight = 2; this.isGoldenPipe = true;
                }
                else { this.stateTimer = Math.floor(Math.random() * 6) + 3; }
            } else if (Math.random() < 0.1) {
                this.game.entities.push(new Goomba(x * TILE_SIZE, (this.groundY - 1) * TILE_SIZE));
            }
        } else if (this.state === 'pit') {
            this.stateTimer--; if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = Math.floor(Math.random() * 5) + 3; }
        } else if (this.state === 'pipe_start') {
            this.buildGround(col, x, this.groundY); this.buildPipe(col, x, this.stateTimer === 2); this.stateTimer--;
            if (this.stateTimer <= 0) { this.state = 'pipe_gap'; this.stateTimer = Math.floor(Math.random() * 4) + 3; }
        } else if (this.state === 'pipe_gap') {
            this.buildGround(col, x, this.groundY); this.stateTimer--;
            if (this.stateTimer === 2) this.game.entities.push(new Goomba(x * TILE_SIZE, (this.groundY - 1) * TILE_SIZE)); 
            if (this.stateTimer <= 0) { this.state = 'pipe_end'; this.stateTimer = 2; this.pipeHeight = Math.floor(Math.random() * 3) + 2; }
        } else if (this.state === 'pipe_end') {
            this.buildGround(col, x, this.groundY); this.buildPipe(col, x, this.stateTimer === 2); this.stateTimer--;
            if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = Math.floor(Math.random() * 5) + 3; }
        } else if (this.state === 'gold_pipe_start') {
            this.buildGround(col, x, this.groundY); this.buildPipe(col, x, this.stateTimer === 2); this.stateTimer--;
            if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = Math.floor(Math.random() * 5) + 3; }
        }
        this.columns[x] = col; this.bgColumns[x] = bgCol;
    }

    buildGround(col, x, yStart) { for (let y = yStart; y < this.rows; y++) col[y] = { x, y, type: 'ground', solid: true, bounceY: 0 }; }

    updateGeneration(cameraX) {
        let targetCol = Math.floor((cameraX + canvas.width) / TILE_SIZE) + 2;
        while (this.lastGenX < targetCol) this.generateColumn();
        let cleanupCol = Math.floor(cameraX / TILE_SIZE) - 10;
        if (cleanupCol > 0 && this.columns[cleanupCol]) { delete this.columns[cleanupCol]; delete this.bgColumns[cleanupCol]; }
    }

    getIntersectingTiles(rect, shrinkX=0, shrinkY=0) {
        let tiles = [];
        let startX = Math.max(0, Math.floor((rect.x + shrinkX) / TILE_SIZE));
        let endX = Math.floor((rect.x + rect.w - shrinkX - 0.001) / TILE_SIZE);
        let startY = Math.max(0, Math.floor((rect.y + shrinkY) / TILE_SIZE));
        let endY = Math.min(this.rows - 1, Math.floor((rect.y + rect.h - shrinkY - 0.001) / TILE_SIZE));
        for (let x = startX; x <= endX; x++) {
            if (!this.columns[x]) continue;
            for (let y = startY; y <= endY; y++) if (this.columns[x][y]) tiles.push(this.columns[x][y]);
        }
        return tiles;
    }

    hitBlock(tx, ty, isBig) {
        if (!this.columns[tx] || !this.columns[tx][ty]) return;
        let t = this.columns[tx][ty];
        if (t.type === 'qblock') {
            t.type = 'usedblock'; t.bounceY = -4; playSound('bump');
            if (t.item === 'coin') this.game.addCoin(100, tx * TILE_SIZE, ty * TILE_SIZE, true);
            else if (t.item === 'mushroom') { playSound('powerup'); this.game.entities.push(new Mushroom(tx * TILE_SIZE, ty * TILE_SIZE)); }
            else if (t.item === 'star') { playSound('powerup'); this.game.entities.push(new Star(tx * TILE_SIZE, ty * TILE_SIZE)); }
        } else if (t.type === 'brick') {
            if (isBig) {
                this.columns[tx][ty] = null; playSound('bump');
                let px = tx * TILE_SIZE; let py = ty * TILE_SIZE;
                this.game.particles.push(new BrickDebris(px, py, -2, -4)); this.game.particles.push(new BrickDebris(px+8, py, 2, -4));
                this.game.particles.push(new BrickDebris(px, py+8, -2, -2)); this.game.particles.push(new BrickDebris(px+8, py+8, 2, -2));
                this.game.addCoin(50, px, py, false);
            } else { t.bounceY = -4; playSound('bump'); }
        }
    }

    drawBg(ctx, cameraX) {
        let startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
        let endCol = startCol + Math.ceil(canvas.width / TILE_SIZE) + 1;
        for (let x = startCol; x <= endCol; x++) {
            if (!this.bgColumns[x]) continue;
            for (let y = 0; y < this.rows; y++) {
                if (this.bgColumns[x][y] === 'cloud') ctx.drawImage(Sprites.cloud, x * TILE_SIZE, y * TILE_SIZE);
            }
        }
    }

    draw(ctx, cameraX) {
        this.animTimer++;
        let startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
        let endCol = startCol + Math.ceil(canvas.width / TILE_SIZE) + 1;
        for (let x = startCol; x <= endCol; x++) {
            if (!this.columns[x]) continue;
            for (let y = 0; y < this.rows; y++) {
                let t = this.columns[x][y]; if (!t) continue;
                if (t.bounceY < 0) t.bounceY += 1;
                let drawX = x * TILE_SIZE; let drawY = y * TILE_SIZE + t.bounceY; let sp = null;
                switch(t.type) {
                    case 'ground': sp = Sprites.ground; break; case 'brick': sp = Sprites.brick; break;
                    case 'qblock': sp = (Math.floor(this.animTimer / 15) % 2 === 0) ? Sprites.qBlock : Sprites.usedBlock; break;
                    case 'usedblock': sp = Sprites.usedBlock; break;
                    case 'pipeTL': sp = Sprites.pipeTL; break; case 'pipeTR': sp = Sprites.pipeTR; break;
                    case 'pipeL': sp = Sprites.pipeL; break; case 'pipeR': sp = Sprites.pipeR; break;
                    case 'gPipeTL': sp = Sprites.gPipeTL; break; case 'gPipeTR': sp = Sprites.gPipeTR; break;
                    case 'gPipeL': sp = Sprites.gPipeL; break; case 'gPipeR': sp = Sprites.gPipeR; break;
                }
                if (sp) ctx.drawImage(sp, drawX, drawY);
            }
        }
    }
}

let game; let isStarted = false; let lastTime = 0;
function gameLoop(timestamp) {
    if(!isStarted) return requestAnimationFrame(gameLoop);
    let deltaTime = timestamp - lastTime;
    if (deltaTime > 16) { game.update(); game.draw(); lastTime = timestamp; }
    requestAnimationFrame(gameLoop);
}

document.getElementById('start-screen').addEventListener('click', startGame);
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !isStarted) startGame(); });

function startGame() {
    if(isStarted) return; initAudio(); game = new Game();
    document.getElementById('start-screen').style.display = 'none';
    isStarted = true; lastTime = performance.now(); requestAnimationFrame(gameLoop);
}
ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
