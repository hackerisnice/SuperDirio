<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Dirio - Ultimate Edition</title>
    <style>
        /* 极致暴力的样式重置，杜绝任何浏览器默认样式的干扰 */
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative; width: 100%; max-width: 1024px; aspect-ratio: 256 / 240;
            background-color: #5c94fc; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        
        /* 绝对定位的钢铁布局虚拟按键，恢复成动态巨型尺寸！ */
        #mobile-controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; pointer-events: none; z-index: 10;
        }
        .ctrl-btn {
            position: absolute; 
            /* 恢复巨型尺寸：随屏幕动态放大，最大 90px */
            width: min(21vw, 150px); height: min(21vw, 150px); 
            background: rgba(255, 255, 255, 0.25);
            border: 4px solid rgba(255, 255, 255, 0.8); border-radius: 50%; pointer-events: auto;
            color: #fff; font-weight: bold; font-size: min(5vw, 24px); text-align: center; line-height: 1.1;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5); backdrop-filter: blur(2px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .ctrl-btn small { font-size: 0.45em; color: #ffeb3b; text-shadow: 1px 1px 0 #000; margin-top: 3px; font-weight: normal; }
        .ctrl-btn.pressed { background: rgba(255, 255, 255, 0.7); transform: scale(0.92); box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* 精确计算的相对位置，模拟经典手柄弧度且绝不重叠 */
        #btn-left  { bottom: 16%; left: 3%; }
        #btn-down  { bottom: 2%; left: calc(3% + min(21vw, 150px) * 0.95); width: min(16vw, 130px); height: min(16vw, 130px); font-size: min(3.5vw, 75px); }
        #btn-right { bottom: 16%; left: calc(3% + min(21vw, 150px) * 1.9); }
        
        #btn-b     { bottom: 8%; right: calc(4% + min(21vw, 150px) * 1.15); }
        #btn-a     { bottom: 25%; right: 4%; }

        /* UI 与 启动屏 */
        #ui-layer {
            position: absolute; top: 10px; left: 10px; right: 10px; color: white;
            font-weight: bold; display: flex; justify-content: space-between;
            font-size: clamp(12px, 3vw, 24px); text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 5;
        }
        @media (hover: hover) and (pointer: fine) { #mobile-controls { display: none; } }
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999; cursor: pointer; text-align: center;
        }
        .pixel-btn {
            margin-top: 30px; padding: 15px 30px; background-color: #e52521; color: #fff;
            font-size: 24px; font-weight: bold; border: 4px solid #fff;
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.4), inset 4px 4px 0 rgba(255,255,255,0.4), 4px 4px 0 #000;
            animation: blink 1.5s infinite;
        }
        .audio-toggle-btn {
            margin-top: 12px; padding: 10px 18px; background-color: #2b2b2b; color: #fff;
            font-size: 16px; font-weight: bold; border: 3px solid #fff; cursor: pointer;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.4), inset 3px 3px 0 rgba(255,255,255,0.25), 3px 3px 0 #000;
        }
        .audio-toggle-btn.off { background-color: #6a1b1b; }
        #item-fab { position:absolute; left:8px; top:78px; z-index:22; font-weight:bold; border:2px solid #fff; background:#1e3a8a; color:#fff; padding:6px 10px; }
        #item-panel { position:absolute; left:8px; top:106px; width:180px; max-height:126px; overflow:auto; z-index:23; background:rgba(0,0,0,0.9); color:#fff; border:2px solid #fff; padding:10px; display:none; }
        #item-close { position:absolute; right:4px; top:4px; }
        #shop-dialog { position:absolute; left:50%; bottom:54px; transform:translateX(-50%); width:min(94%,560px); z-index:24; background:rgba(0,0,0,0.88); color:#fff; border:2px solid #fff; padding:10px; display:none; }
        .shop-btn { margin:4px 6px 0 0; }
        @keyframes blink { 0%, 100% { color: #fff; } 50% { color: #ffeb3b; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="256" height="240"></canvas>
    
    <div id="ui-layer">
        <div>DIRIO<br><span id="score">000000</span></div>
        <div>COINS<br><span id="coins">0000</span></div>
        <div>WORLD<br>Endless</div>
        <div>TIME<br><span id="time">000</span></div>
    </div>
    <button id="item-fab" onclick="toggleItemPanel()">道具</button>
    <div id="item-panel">
        <button id="item-close" onclick="toggleItemPanel(false)">X</button>
        <div style="font-weight:bold; margin-bottom:8px;">道具栏</div>
        <div id="item-list"></div>
    </div>
    <div id="shop-dialog">
        <div id="shop-title" style="font-weight:bold;">金色马里奥：要买点啥？</div>
        <div id="shop-actions"></div>
    </div>

    <!-- 钢铁布局的移动端巨型按键 -->
    <div id="mobile-controls">
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-down">▼<br><small>钻管</small></div>
        <div class="ctrl-btn" id="btn-right">▶</div>
        <div class="ctrl-btn" id="btn-b">B<br><small>跑/射</small></div>
        <div class="ctrl-btn" id="btn-a">A<br><small>跳跃</small></div>
    </div>
    
    <div id="start-screen" onclick="startGame()">
        <h1 style="color: #ffcccc; text-shadow: 4px 4px 0 #f00; font-size: 2.5em; margin: 0;">SUPER DIRIO</h1>
        <p style="color: #ffeb3b; font-weight: bold; margin-top: 5px;">ULTIMATE EDITION</p>
        <div class="pixel-btn">START GAME</div>
        <button class="audio-toggle-btn" id="audio-toggle-btn" onclick="toggleAudio(event)">音效：开启</button>
        <p style="font-size: 0.8em; margin-top: 25px; line-height: 1.6;">
            WASD 移动 | J/Z 开火/加速 | K/X/空格 跳跃<br>
            <span style="color: #4CAF50;">需 1000 金币钻入金管 (已赠送)</span><br>
            <span style="color: #ff0000; font-weight: bold;">【更新】手机巨型虚拟按键回归，操作更爽快！</span>
        </p>
    </div>
</div>

<script>
/** 核心引擎与全局累积状态 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');
ctx.imageSmoothingEnabled = false;

const TILE_SIZE = 16;
const GRAVITY = 0.25;         
const MAX_FALL_SPEED = 4.5;   
const JUMP_SPEED = -5.0;     
const MOVE_ACCEL = 0.04;      
const AIR_ACCEL = 0.03;       
const MOVE_FRICTION = 0.88;   
const AIR_FRICTION = 0.95;    
const MAX_WALK_SPEED = 1.6;   
const MAX_RUN_SPEED = 2.8;    

let globalScore = 0;
let globalCoins = 1000; 
let globalTime = 0;
let soundEnabled = true;

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!audioCtx || !soundEnabled) return;
    try {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
        if (type === 'jump') {
            osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now); osc.frequency.setValueAtTime(1500, now + 0.05);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'stomp') {
            osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'bump') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'powerup') {
            osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(800, now + 0.5);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'pipe') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(300, now + 0.1); osc.frequency.setValueAtTime(200, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'shoot') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'death') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(50, now + 1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 1); osc.start(now); osc.stop(now + 1);
        } else if (type === 'kick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'star') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
        }
    } catch(e){}
}

function toggleAudio(event) {
    if (event) event.stopPropagation();
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('audio-toggle-btn');
    if (!btn) return;
    btn.textContent = `音效：${soundEnabled ? '开启' : '关闭'}`;
    btn.classList.toggle('off', !soundEnabled);
}

const C = {
    'T': 'transparent', 'R': '#e52521', 'B': '#6b8c42', 'b': '#b53120', 'S': '#f0d0b0', 'O': '#c84c0c', 'o': '#000000', 
    'W': '#ffffff', 'G': '#00a800', 'g': '#005800', 'C': '#f8d820', 'M': '#e83000', 'D': '#444444', 'Y': '#f8d820', 'y': '#c88c00'
};

function buildSprite(ascii, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const xCtx = c.getContext('2d'); const lines = ascii.trim().split('\n');
    for (let y = 0; y < h; y++) {
        let row = lines[y] ? lines[y].trim() : '';
        for (let x = 0; x < w; x++) {
            let char = row[x] || 'T';
            if (char !== 'T' && char !== '.') { xCtx.fillStyle = C[char]; xCtx.fillRect(x, y, 1, 1); }
        }
    }
    return c;
}

    { name: 'Pistol', speed: 6, dmg: 10, cooldown: 20, color: '#ffffff', w: 4, h: 4 },
    { name: 'Shotgun', speed: 5, dmg: 8, cooldown: 35, color: '#ffff00', w: 3, h: 3 },

const Input = { left: false, right: false, up: false, down: false, jump: false, run: false, jumpPressed: false };
const inventory = { shell: 0, bird: 0 };
let itemPanelOpen = false;
function refreshItemPanel() {
    const el = document.getElementById('item-list');
    if (!el) return;
    el.innerHTML = `龟壳 x${inventory.shell}<br>飞鸟 x${inventory.bird}<br><small>小游戏内隐藏且禁用</small>`;
}
function toggleItemPanel(force) {
    if (!game || game.mode !== 'main') return;
    itemPanelOpen = force === undefined ? !itemPanelOpen : !!force;
    document.getElementById('item-panel').style.display = itemPanelOpen ? 'block' : 'none';
    refreshItemPanel();
}

document.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') Input.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') Input.right = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') Input.down = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') Input.up = true;
    if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'KeyX') { if (!Input.jump) Input.jumpPressed = true; Input.jump = true; }
    if (e.code === 'KeyJ' || e.code === 'KeyZ' || e.shiftKey) Input.run = true;
});
document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') Input.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') Input.right = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') Input.down = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') Input.up = false;
    if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'KeyX') Input.jump = false;
    if (e.code === 'KeyJ' || e.code === 'KeyZ' || e.shiftKey) Input.run = false;
});

function bindTouch(id, keyField, isJump=false) {
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        if(isJump && !Input[keyField]) Input.jumpPressed = true;
        Input[keyField] = true; el.classList.add('pressed');
    }, {passive: false});
    el.addEventListener('touchend', (e) => {
        e.preventDefault(); Input[keyField] = false; el.classList.remove('pressed');
    }, {passive: false});
}
bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right'); bindTouch('btn-down', 'down');
bindTouch('btn-a', 'jump', true); bindTouch('btn-b', 'run');

class Game {
    constructor() { this.reset(); }

    reset() {
        this.mode = 'main'; this.cameraX = 0; this.frames = 0; 
        this.entities = []; this.particles = []; this.projectiles = [];
        this.player = new Player(32, 60); this.entities.push(this.player);
        this.merchant = new GoldenMario(180, 110); this.entities.push(this.merchant);
        this.shopOpen = false; this.itemCooldown = 0; this.aimY = 120; this.activeMerchant = null;
        this.map = new InfiniteMap(this); this.maxDist = 0;
        this.deathTimer = 0; this.savedMainState = null;
    }

    gainReward(val, x, y) {
        globalScore += val;
        globalCoins += val; 
        this.particles.push(new ScoreParticle(x, y, `+${val}`, '#ffeb3b'));
    }
    toggleShop(merchant = null) {
        if (this.mode !== 'main') return;
        if (merchant) this.activeMerchant = merchant;
        this.shopOpen = !this.shopOpen;
        const dialog = document.getElementById('shop-dialog');
        dialog.style.display = this.shopOpen ? 'block' : 'none';
        if (!this.shopOpen) return;
        const actions = document.getElementById('shop-actions');
        const opts = [
            ['变大蘑菇', 200, () => { if (!this.player.isBig) { this.player.isBig = true; this.player.h = 32; this.player.y -= 16; } }],
            ['无敌星', 500, () => { this.player.starTimer = 600; }],
            ['龟壳', 100, () => { inventory.shell++; refreshItemPanel(); }],
            ['飞鸟', 300, () => { inventory.bird++; refreshItemPanel(); }]
        ];
        actions.innerHTML = '';
        opts.forEach(([name, cost, fn]) => {
            const btn = document.createElement('button');
            btn.className = 'shop-btn';
            btn.textContent = `${name} (${cost})`;
            btn.onclick = () => { if (globalCoins >= cost) { globalCoins -= cost; fn(); playSound('coin'); } };
            actions.appendChild(btn);
        });
    }

    enterMiniGame(type = 'random') {
        const miniType = type === 'random' ? (Math.random() < 0.3 ? 'dodge' : 'shootout') : type;
        this.savedMainState = {
            cameraX: this.cameraX, playerX: this.player.x, playerY: this.player.y,
            isBig: this.player.isBig, starTimer: this.player.starTimer,
            entities: this.entities.filter(e => e.type !== 'player') 
        };
        this.mode = miniType; this.cameraX = 0;
        this.player.x = 20; this.player.y = 80; 
        this.player.isBig = false; this.player.h = 16; 
        this.player.hp = 100; this.player.shootCooldown = 0; this.player.facingRight = true;
        this.player.currentGun = WEAPONS[Math.floor(Math.random()*WEAPONS.length)]; 

        if (this.mode === 'shootout') {
            this.shootoutArena = new ShootoutArena(this);
            this.boss = new BossTurtle((this.shootoutArena.cols - 4) * TILE_SIZE, 80);
            this.entities = [this.player, this.boss]; this.projectiles = []; this.particles = [];
        } else {
            this.dodgeArena = new DodgeArena(this);
            this.dodgeArena.reset();
            this.player.x = 120; this.player.y = 120; this.player.vx = 0; this.player.vy = 0;
            this.entities = [this.player]; this.projectiles = []; this.particles = [];
        }
        this.miniGameEnding = false; this.exitTimer = 0;
    }

    exitMiniGame(win) {
        const prevMode = this.mode;
        this.mode = 'main';
        if (win) { 
            this.gainReward(prevMode === 'dodge' ? 3000 : 2000, this.player.x, this.player.y); 
            playSound('powerup'); 
        } else { 
            playSound('pipe'); 
        }
        
        let s = this.savedMainState;
        this.cameraX = s.cameraX + 2000; 
        let outCol = Math.floor(this.cameraX / TILE_SIZE) + 8;
        this.map.lastGenX = outCol;
        
        for(let i=0; i<15; i++) { this.map.state = 'safe_zone'; this.map.generateColumn(); }
        let pipeX = outCol + 5;
        this.map.buildPipe(this.map.columns[pipeX], pipeX, true, true);
        this.map.buildPipe(this.map.columns[pipeX+1], pipeX+1, false, true);

        this.player.x = pipeX * TILE_SIZE + 2; 
        this.player.y = (this.map.groundY - 2) * TILE_SIZE; 
        this.player.isBig = s.isBig; this.player.h = s.isBig ? 32 : 16; this.player.starTimer = s.starTimer;
        this.player.vx = 0; this.player.vy = -8; this.player.state = 'jump'; this.player.isDeadState = false; 
        
        this.deathTimer = 0; this.entities = [this.player, this.merchant]; this.projectiles = [];
        this.map.updateGeneration(this.cameraX); this.miniGameEnding = false; this.savedMainState = null;
    }

    fireWeapon(entity, isPlayer) {
        let gun = entity.currentGun;
        if (!gun) return;
        let dir = entity.facingRight ? 1 : -1;
        let spawnX = entity.facingRight ? entity.x + entity.w : entity.x - gun.w;
        let spawnY = entity.y + entity.h/2 - gun.h/2;
        if (gun.name === 'Shotgun') {
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, -1.5, gun, isPlayer));
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, 0, gun, isPlayer));
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, 1.5, gun, isPlayer));
        } else {
            this.projectiles.push(new Projectile(spawnX, spawnY, dir*gun.speed, 0, gun, isPlayer));
        }
        entity.shootCooldown = gun.cooldown; playSound('shoot');
        entity.currentGun = WEAPONS[Math.floor(Math.random()*WEAPONS.length)];
    }

    update() {
        if (this.player.isDeadState) {
            if (this.deathTimer > 0) {
                this.deathTimer--;
                if (this.deathTimer <= 0) {
                    if (this.mode === 'shootout' || this.mode === 'dodge') this.exitMiniGame(false); 
                    else this.reset(); 
                }
            }
        }
        this.frames++; if (this.frames % 60 === 0 && this.mode === 'main') globalTime++;

        let currentMap = this.mode === 'shootout' ? this.shootoutArena : this.map;
        if (this.mode === 'main') {
            this.map.updateGeneration(this.cameraX);
            let currentDist = Math.max(0, Math.floor(this.player.x / 10));
            if (currentDist > this.maxDist) { globalScore += (currentDist - this.maxDist); this.maxDist = currentDist; }
            if (this.itemCooldown > 0) this.itemCooldown--;
            const nearMerchant = this.entities.find(e =>
                e.type === 'golden_mario' &&
                Math.abs((e.x + e.w / 2) - (this.player.x + this.player.w / 2)) < 20 &&
                Math.abs((e.y + e.h / 2) - (this.player.y + this.player.h / 2)) < 26
            );
            if (Input.run && this.player.shootCooldown <= 0 && nearMerchant) {
                this.toggleShop(nearMerchant); this.player.shootCooldown = 20;
            }
            if (this.shopOpen) this.player.invincibleTimer = Math.max(this.player.invincibleTimer, 2);
            if (inventory.bird > 0) {
                if (Input.up) this.aimY = Math.max(12, this.aimY - 2);
                if (Input.down) this.aimY = Math.min(228, this.aimY + 2);
                if (Input.jumpPressed && this.itemCooldown <= 0 && !this.shopOpen) {
                    inventory.bird--; refreshItemPanel(); this.itemCooldown = 14; Input.jumpPressed = false;
                    const sx = this.player.x + (this.player.facingRight ? this.player.w : -8);
                    const sy = this.player.y + this.player.h / 2;
                    const dx = (this.cameraX + 8) - sx; const dy = this.aimY - sy;
                    const len = Math.hypot(dx, dy) || 1;
                    this.entities.push(new ThrownBird(sx, sy, (dx / len) * 3.2, (dy / len) * 3.2));
                }
            }
            if (inventory.shell > 0 && Input.down && this.player.onGround && this.itemCooldown <= 0) {
                inventory.shell--; refreshItemPanel(); this.itemCooldown = 14;
                const shell = new Koopa(this.player.x + (this.player.facingRight ? 14 : -14), this.player.y);
                shell.state = 'shell_slide'; shell.vx = this.player.facingRight ? 3.6 : -3.6; shell.vy = 0; shell.onGround = true;
                shell.ownerPlayer = true;
                this.entities.push(shell);
            }
        }

        for (let i = this.entities.length - 1; i >= 0; i--) {
            let e = this.entities[i];
            if (!(this.mode === 'dodge' && e === this.player)) e.update(currentMap, this.entities);
            if (e.dead) this.entities.splice(i, 1);
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i]; p.update();
            if (p.dead) this.particles.splice(i, 1);
        }

            if (this.mode === 'shootout') {
            if (this.player.shootCooldown > 0) this.player.shootCooldown--;
            if (Input.run && this.player.shootCooldown <= 0 && !this.miniGameEnding && !this.player.isDeadState) this.fireWeapon(this.player, true);
            
            if (this.player.x < 16) this.player.x = 16; 
            let maxW = (this.shootoutArena.cols - 1) * TILE_SIZE - this.player.w;
            if (this.player.x > maxW) this.player.x = maxW; 

            let targetCam = this.player.x - canvas.width / 2;
            if (targetCam < 0) targetCam = 0;
            let maxCam = this.shootoutArena.cols * TILE_SIZE - canvas.width;
            if (targetCam > maxCam) targetCam = maxCam;
            this.cameraX = targetCam;

            for (let i = this.projectiles.length - 1; i >= 0; i--) {
                let p = this.projectiles[i]; p.update(currentMap);
                if (!p.isPlayer && this.player.intersects(p) && !this.player.isDeadState) {
                    this.player.hp -= p.weapon.dmg; this.projectiles.splice(i, 1);
                    this.particles.push(new ScoreParticle(this.player.x, this.player.y, `-${p.weapon.dmg}`, '#ff0000')); playSound('bump'); 
                }
                else if (p.isPlayer && this.boss && !this.boss.isDeadState && this.boss.intersects(p)) {
                    this.boss.hp -= p.weapon.dmg; this.projectiles.splice(i, 1);
                    this.particles.push(new ScoreParticle(this.boss.x, this.boss.y, `-${p.weapon.dmg}`, '#ffff00')); playSound('bump'); 
                }
                if (p.dead) this.projectiles.splice(i, 1);
            }

            if (!this.miniGameEnding) {
                if (this.player.hp <= 0 && !this.player.isDeadState) { this.player.die(); this.miniGameEnding = true; }
                else if (this.boss.hp <= 0 && !this.boss.isDeadState) { this.boss.die(); this.miniGameEnding = true; this.exitTimer = 120; }
            } else {
                if (this.boss.isDeadState && this.exitTimer > 0) { this.exitTimer--; if (this.exitTimer <= 0) this.exitMiniGame(true); }
                else if (!this.player.isDeadState && this.exitTimer > 0) { this.exitTimer--; if (this.exitTimer <= 0) this.exitMiniGame(false); }
            }
            } else if (this.mode === 'dodge') {
                this.dodgeArena.update();
                if (!this.player.isDeadState) {
                    const speed = 1.35;
                    const moveX = (Input.left ? -1 : 0) + (Input.right ? 1 : 0);
                    const dodgeUp = Input.up || Input.jump;
                    const moveY = (dodgeUp ? -1 : 0) + (Input.down ? 1 : 0);
                    const len = Math.hypot(moveX, moveY) || 1;
                    this.player.vx = moveX === 0 ? 0 : (moveX / len) * speed;
                    this.player.vy = moveY === 0 ? 0 : (moveY / len) * speed;
                    this.player.x += this.player.vx;
                    this.player.y += this.player.vy;
                    this.player.x = Math.max(8, Math.min(256 - this.player.w - 8, this.player.x));
                    this.player.y = Math.max(8, Math.min(240 - this.player.h - 8, this.player.y));
                    if (this.dodgeArena.hitPlayer(this.player)) this.player.die();
                }
                if (this.dodgeArena.winFrames <= 0 && !this.player.isDeadState) {
                    this.exitMiniGame(true);
                    return;
                }
            } else {
                if (this.player.x > this.cameraX + canvas.width / 2) this.cameraX = this.player.x - canvas.width / 2;
                // 避免浮点误差导致贴近左边缘时被“瞬间吸回”
                if (this.player.x < this.cameraX - 0.5) { this.player.x = this.cameraX; this.player.vx = 0; }
            if (this.player.y > canvas.height + 32 && !this.player.isDeadState) this.player.die();
        }

        const inMiniGame = this.mode === 'shootout' || this.mode === 'dodge';
        uiLayer.style.display = inMiniGame ? 'none' : 'flex';
        document.getElementById('item-fab').style.display = inMiniGame ? 'none' : 'block';
        document.getElementById('item-panel').style.display = (!inMiniGame && itemPanelOpen) ? 'block' : 'none';
        if (inMiniGame) { this.shopOpen = false; document.getElementById('shop-dialog').style.display = 'none'; }
        document.getElementById('score').innerText = globalScore.toString().padStart(6, '0');
        document.getElementById('coins').innerText = globalCoins.toString().padStart(4, '0');
        document.getElementById('time').innerText = globalTime.toString().padStart(3, '0');
    }

    draw() {
        ctx.fillStyle = (this.mode === 'shootout' || this.mode === 'dodge') ? '#222' : '#5c94fc'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(-Math.floor(this.cameraX), 0);
        
        if (this.mode === 'shootout') {
            this.shootoutArena.draw(ctx, this.cameraX);
            this.entities.forEach(e => { if(e !== this.player) e.draw(ctx) });
            this.player.draw(ctx); this.projectiles.forEach(p => p.draw(ctx));
        } else if (this.mode === 'dodge') {
            this.dodgeArena.draw(ctx);
            this.player.draw(ctx);
        } else {
            this.map.drawBg(ctx, this.cameraX);
            if (this.player.state === 'enter_pipe') {
                this.entities.forEach(e => { if(e !== this.player) e.draw(ctx) });
                this.player.draw(ctx); this.map.draw(ctx, this.cameraX);
            } else {
                this.map.draw(ctx, this.cameraX);
                this.entities.forEach(e => { if(e !== this.player) e.draw(ctx) });
                this.player.draw(ctx);
            }
        }
        this.particles.forEach(p => p.draw(ctx));
        if (this.mode === 'main' && inventory.bird > 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.setLineDash([3, 2]);
            ctx.beginPath(); ctx.moveTo(this.cameraX + 8, this.aimY); ctx.lineTo(this.player.x + (this.player.facingRight ? this.player.w : 0), this.player.y + this.player.h / 2); ctx.stroke();
            ctx.setLineDash([]);
        }
        ctx.restore();

        if (this.mode === 'shootout') {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,256,42); ctx.fillStyle = 'white'; ctx.font = 'bold 10px Courier New';
            ctx.fillText(`P1 HP:${Math.max(0, this.player.hp)}`, 5, 12);
            let pGun = this.player.currentGun;
            ctx.fillStyle = pGun ? pGun.color : 'gray'; ctx.fillText(`[${pGun ? pGun.name : 'EMPTY'} ∞]`, 5, 24);
            ctx.fillStyle = '#ffeb3b'; ctx.fillText(`PRESS B TO SHOOT`, 5, 36);
            ctx.fillStyle = 'white'; ctx.fillText(`BOSS HP:${Math.max(0, this.boss ? this.boss.hp : 0)}`, 140, 12);
            let bGun = this.boss && this.boss.currentGun;
            ctx.fillStyle = bGun ? bGun.color : 'gray'; ctx.fillText(`[${bGun ? bGun.name : 'EMPTY'} ∞]`, 140, 24);
        } else if (this.mode === 'dodge') {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,256,36);
            ctx.fillStyle = '#9cf'; ctx.font = 'bold 10px Courier New';
            const totalSec = this.dodgeArena.totalWinSeconds;
            const remainSec = Math.max(0, Math.ceil(this.dodgeArena.winFrames / 60));
            const survivedSec = Math.max(0, totalSec - remainSec);
            ctx.fillText(`生存:${survivedSec}s/${totalSec}s`, 6, 12);
            ctx.fillStyle = '#8f8'; ctx.fillText(`方向键/右下按键移动，别碰蓝线`, 6, 25);
        }
    }
}

class DodgeArena {
    constructor(gameInst) {
        this.game = gameInst; this.width = 256; this.height = 240; this.totalWinSeconds = 90;
        this.hazards = [];
        this.reset();
    }
    reset() {
        this.frame = 0;
        this.winFrames = 60 * this.totalWinSeconds;
        this.hazards = [];
    }
    spawnTelegraphLine(fast=true) {
        const vertical = Math.random() < 0.5;
        const limit = vertical ? this.width : this.height;
        const minGap = 46;
        let pos = 20 + Math.random() * (limit - 40);
        let tries = 0;
        while (tries < 12 && this.hazards.some(h =>
            h.type === 'line' &&
            h.vertical === vertical &&
            (h.state === 'warn' || h.state === 'hit') &&
            Math.abs(h.pos - pos) < minGap
        )) {
            pos = 20 + Math.random() * (limit - 40);
            tries++;
        }
        if (tries >= 12) return;
        const delay = 180;
        this.hazards.push({type:'line', vertical, pos, state:'warn', timer:delay, life: fast ? 120 : 190, colorWarn: '#f33', colorHit: fast ? '#39f' : '#3f3', thickness: fast ? 4 : 3});
    }
    spawnGear() {
        const r = Math.random() < 0.5 ? 10 : 18;
        const x = 20 + Math.random() * (this.width - 40), y = 20 + Math.random() * (this.height - 40);
        this.hazards.push({
            type:'gear', x, y, r, state:'warn', timer:180, life:150,
            colorWarn:'#f33', colorHit:'#39f', angle: 0, spin: (Math.random() < 0.5 ? 1 : -1) * (0.05 + Math.random() * 0.04),
            outerRing: r + 6
        });
    }
    spawnGreenRayNoWarn() {
        const edge = Math.floor(Math.random()*4);
        let x=0,y=0,vx=0,vy=0,s=1.1;
        if (edge===0){x=0;y=Math.random()*this.height;vx=s;}
        if (edge===1){x=this.width;y=Math.random()*this.height;vx=-s;}
        if (edge===2){x=Math.random()*this.width;y=0;vy=s;}
        if (edge===3){x=Math.random()*this.width;y=this.height;vy=-s;}
        this.hazards.push({type:'green_ray', x,y,vx,vy,life:220,r:4,color:'#37ff37'});
    }
    update() {
        this.frame++; this.winFrames--;
        if (this.frame % 85 === 0) this.spawnTelegraphLine(true);
        if (this.frame % 170 === 0) this.spawnGear();
        if (this.frame % 90 === 0) this.spawnGreenRayNoWarn();
        // 移除骨头波形弹幕
        for (const h of this.hazards) {
            if (h.type === 'line' || h.type === 'gear') {
                if (h.state === 'warn') { h.timer--; if (h.timer <= 0) h.state = 'hit'; }
                else h.life--;
                if (h.type === 'gear') h.angle += h.spin;
            } else if (h.type === 'green_ray') {
                h.x += h.vx; h.y += h.vy; h.life--;
            }
        }
        this.hazards = this.hazards.filter(h => h.life > 0);
    }
    hitPlayer(p) {
        for (const h of this.hazards) {
            if (h.type === 'line' && h.state === 'hit') {
                if (h.vertical) { if (Math.abs((p.x + p.w/2) - h.pos) < h.thickness + p.w/2) return true; }
                else if (Math.abs((p.y + p.h/2) - h.pos) < h.thickness + p.h/2) return true;
            } else if (h.type === 'gear' && h.state === 'hit') {
                let dx = (p.x + p.w/2) - h.x, dy = (p.y + p.h/2) - h.y;
                if (Math.hypot(dx,dy) < h.outerRing + 2) return true;
            } else if (h.type === 'green_ray') {
                if (Math.abs((p.x + p.w/2) - h.x) < h.r + p.w/2 && Math.abs((p.y + p.h/2) - h.y) < h.r + p.h/2) return true;
            }
        }
        return false;
    }
    draw(ctx) {
        ctx.fillStyle = '#101820'; ctx.fillRect(0,0,this.width,this.height);
        for (const h of this.hazards) {
            if (h.type === 'line') {
                ctx.fillStyle = (h.state === 'warn' ? (Math.floor(this.frame / 8) % 2 ? '#ff7777' : h.colorWarn) : h.colorHit);
                if (h.vertical) ctx.fillRect(h.pos - h.thickness/2, 0, h.thickness, this.height);
                else ctx.fillRect(0, h.pos - h.thickness/2, this.width, h.thickness);
            } else if (h.type === 'gear') {
                ctx.strokeStyle = (h.state === 'warn' ? (Math.floor(this.frame / 8) % 2 ? '#ff8888' : h.colorWarn) : h.colorHit);
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.stroke();
                // 外圈碰撞环
                ctx.globalAlpha = 0.35;
                ctx.beginPath(); ctx.arc(h.x, h.y, h.outerRing, 0, Math.PI*2); ctx.stroke();
                ctx.globalAlpha = 1;
                // 旋转齿
                ctx.save();
                ctx.translate(h.x, h.y);
                ctx.rotate(h.angle);
                for (let i = 0; i < 8; i++) {
                    ctx.rotate(Math.PI / 4);
                    ctx.fillStyle = (h.state === 'warn' ? '#ff6666' : '#66b3ff');
                    ctx.fillRect(h.r - 1, -2, 6, 4);
                }
                ctx.restore();
            } else if (h.type === 'green_ray') {
                ctx.fillStyle = h.color; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
            }
        }
    }
}

class Projectile {
    constructor(x, y, vx, vy, weapon, isPlayer) {
        this.x = x; this.y = y; this.w = weapon.w; this.h = weapon.h;
        this.vx = vx; this.vy = vy; this.weapon = weapon; this.isPlayer = isPlayer; this.dead = false;
    }
    update(map) { 
        this.x += this.vx; this.y += this.vy; 
        if (this.y < 0 || this.y > 240) { this.dead = true; return; }
        if (map && map.getIntersectingTiles) {
            let tiles = map.getIntersectingTiles({x: this.x, y: this.y, w: this.w, h: this.h});
            if (tiles.some(t => t.solid)) this.dead = true;
        }
    }
    draw(ctx) { ctx.fillStyle = this.weapon.color; ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.w, this.h); }
}

class Entity {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h; this.vx = 0; this.vy = 0;
        this.dead = false; this.onGround = false; this.type = 'none'; this.facingRight = true;
    }
    applyPhysics(map) {
        this.vy += GRAVITY; if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
        this.y += this.vy; this.onGround = false;
        let yTiles = map.getIntersectingTiles({ x: this.x + 2, y: this.y, w: this.w - 4, h: this.h });
        for (let t of yTiles) {
            if (t.solid) {
                if (this.vy > 0) { this.y = t.y * TILE_SIZE - this.h; this.vy = 0; this.onGround = true; }
                else if (this.vy < 0) { this.y = t.y * TILE_SIZE + TILE_SIZE; this.vy = 0; this.onCeilingHit(t, map); }
                break; 
            }
        }
        this.x += this.vx;
        // 横向碰撞使用更窄的垂直采样，降低边角“卡边回弹”问题
        let xTiles = map.getIntersectingTiles({ x: this.x, y: this.y + 3, w: this.w, h: this.h - 6 });
        for (let t of xTiles) {
            if (t.solid) {
                let oldVx = this.vx; 
                if (this.vx > 0) { this.x = t.x * TILE_SIZE - this.w; this.vx = 0; }
                else if (this.vx < 0) { this.x = t.x * TILE_SIZE + TILE_SIZE; this.vx = 0; }
                this.onWallHit(t, oldVx); break;
            }
        }
    }
    onWallHit(tile, oldVx) {} onCeilingHit(tile, map) {}
    intersects(other) { return this.x < other.x + other.w && this.x + this.w > other.x && this.y < other.y + other.h && this.y + this.h > other.y; }
    dieFromStar() { this.state = 'star_dead'; this.vy = -3; this.vx = this.facingRight ? -1 : 1; playSound('kick'); }
}

class Player extends Entity {
    constructor(x, y) {
        super(x, y, 12, 16); this.type = 'player'; this.isBig = false; this.isDeadState = false;
        this.jumpTimer = 0; this.invincibleTimer = 0; this.animTimer = 0; this.state = 'idle';
        this.skidding = false; this.jumpBuffer = 0; this.pipeTimer = 0; this.starTimer = 0;
    }

    update(map, entities) {
        if (this.state === 'enter_pipe') {
            this.y += 0.5; this.pipeTimer--;
            if (this.pipeTimer <= 0) { this.state = 'idle'; game.enterMiniGame(); }
            return;
        }
        if (this.isDeadState) { this.vy += GRAVITY; this.y += this.vy; return; }
        
        if (game.mode === 'main' && Input.down && this.onGround) {
            let centerCol = Math.floor((this.x + this.w / 2) / TILE_SIZE);
            let footRow = Math.floor((this.y + this.h + 1) / TILE_SIZE);
            let tile = map.columns && map.columns[centerCol] ? map.columns[centerCol][footRow] : null;
            if (tile && (tile.type === 'gPipeTL' || tile.type === 'gPipeTR')) {
                if (globalCoins >= 1000) {
                    globalCoins -= 1000; this.state = 'enter_pipe'; this.pipeTimer = 60; this.vx = 0; this.vy = 0;
                    let pipeLeftX = (centerCol * TILE_SIZE) + (tile.type === 'gPipeTL' ? 0 : -TILE_SIZE);
                    this.x = pipeLeftX + 2; playSound('pipe'); return;
                } else {
                    if (this.pipeTimer <= 0) {
                        game.particles.push(new ScoreParticle(this.x - 20, this.y - 10, "NEED 1000 COINS!", "#ff0000"));
                        this.pipeTimer = 30; 
                    }
                }
            }
        }
        if (this.pipeTimer > 0 && this.state !== 'enter_pipe') this.pipeTimer--;

        if (this.invincibleTimer > 0) this.invincibleTimer--;
        if (this.starTimer > 0) { this.starTimer--; if (this.starTimer % 20 === 0 && this.starTimer > 60) playSound('star'); }
        
        let accel = this.onGround ? MOVE_ACCEL : AIR_ACCEL; let friction = this.onGround ? MOVE_FRICTION : AIR_FRICTION;
        this.skidding = false;

        if (Input.left) {
            if (this.vx > 0 && this.onGround) this.skidding = true; 
            this.vx -= accel; this.facingRight = false;
        } else if (Input.right) {
            if (this.vx < 0 && this.onGround) this.skidding = true; 
            this.vx += accel; this.facingRight = true;
        } else { this.vx *= friction; }
        
        let maxSpd = Input.run || this.starTimer > 0 ? MAX_RUN_SPEED + 0.5 : MAX_WALK_SPEED;
        if (this.vx > maxSpd) this.vx = maxSpd; if (this.vx < -maxSpd) this.vx = -maxSpd;
        if (Math.abs(this.vx) < 0.1 && !Input.left && !Input.right) this.vx = 0;

        if (Input.jumpPressed) { this.jumpBuffer = 6; Input.jumpPressed = false; }
        if (this.jumpBuffer > 0) {
            if (this.onGround) { this.vy = JUMP_SPEED; this.onGround = false; this.jumpTimer = 1; this.jumpBuffer = 0; playSound('jump'); }
            else { this.jumpBuffer--; }
        }
        if (Input.jump && this.jumpTimer > 0 && this.jumpTimer < 15) { this.vy -= 0.15; this.jumpTimer++; }
        else if (!Input.jump) { this.jumpTimer = 0; }

        this.applyPhysics(map);

        if (game.mode === 'main') {
            for (let e of entities) {
                if (e === this || e.dead || e.state === 'star_dead' || e.state === 'squished') continue;
                if (this.intersects(e)) {
                    if (e.type === 'coin_item') {
                        e.dead = true; game.gainReward(100, e.x, e.y); playSound('coin');
                    } else if (e.type === 'mushroom') {
                        e.dead = true; game.gainReward(200, e.x, e.y); playSound('powerup');
                        if (!this.isBig) { this.isBig = true; this.y -= 16; this.h = 32; }
                    } else if (e.type === 'star') {
                        e.dead = true; game.gainReward(300, e.x, e.y); playSound('powerup'); this.starTimer = 600; 
                    } else if (e.type === 'golden_mario') {
                        const myCenter = this.x + this.w / 2;
                        const eCenter = e.x + e.w / 2;
                        if (myCenter < eCenter) this.x = e.x - this.w;
                        else this.x = e.x + e.w;
                        this.vx = 0;
                    } else if (e.type === 'goomba' || e.type === 'bird' || e.type === 'koopa') {
                        if (this.starTimer > 0) {
                            e.dieFromStar(); game.gainReward(200, e.x, e.y);
                        } else if (e.type === 'koopa' && e.state === 'shell_idle') {
                            e.state = 'shell_slide'; e.vx = this.x < e.x ? 3.5 : -3.5;
                            playSound('kick'); this.invincibleTimer = 10;
                        } else if (this.vy > 0 && this.y + this.h <= e.y + 12) {
                            e.squish(); this.vy = Input.jump ? -4.8 : -3;
                            game.gainReward(100, e.x, e.y); playSound('stomp');
                        } else if (this.invincibleTimer <= 0) {
                            this.takeDamage();
                        }
                    }
                }
            }
        }

        if (!this.onGround) this.state = 'jump';
        else if (Math.abs(this.vx) > 0.1) { this.state = this.skidding ? 'skid' : 'run'; this.animTimer += Math.abs(this.vx) * 0.3; }
        else this.state = 'idle';
    }

    onCeilingHit(tile, map) {
        this.jumpTimer = 0; if (game.mode === 'main' && (tile.type === 'qblock' || tile.type === 'brick')) map.hitBlock(tile.x, tile.y, this.isBig);
    }

    takeDamage() {
        if (this.isBig) { this.isBig = false; this.h = 16; this.y += 16; this.invincibleTimer = 60; playSound('bump'); }
        else { this.die(); }
    }

    die() {
        if (this.isDeadState) return;
        this.isDeadState = true; this.vy = -5; this.vx = 0; this.state = 'dead';
        playSound('death'); game.deathTimer = game.mode === 'shootout' ? 90 : 120; 
    }

    draw(ctx) {
        if (this.invincibleTimer > 0 && Math.floor(Date.now() / 50) % 2 === 0) return;
        let sprite = Sprites.marioIdle;
        if (this.state === 'dead') sprite = Sprites.marioDead;
        else if (this.state === 'jump') sprite = Sprites.marioJump;
        else if (this.state === 'skid') sprite = Sprites.marioSkid;
        else if (this.state === 'run') { let f = Math.floor(this.animTimer) % 3; sprite = f === 0 ? Sprites.marioRun1 : (f === 1 ? Sprites.marioRun2 : Sprites.marioRun3); }
        
        ctx.save(); ctx.translate(Math.floor(this.x + this.w / 2), Math.floor(this.y));
        let displayFacingRight = this.skidding ? !this.facingRight : this.facingRight;
        if (!displayFacingRight) ctx.scale(-1, 1);
        if (this.starTimer > 0) ctx.filter = `hue-rotate(${(game.frames * 20) % 360}deg) saturate(200%)`;
        if (this.isBig) { ctx.scale(1, 2); ctx.drawImage(sprite, -8, 0); } else { ctx.drawImage(sprite, -8, 0); }
        ctx.restore();
    }
}

class BossTurtle extends Entity {
    constructor(x, y) {
        super(x, y, 32, 32); this.type = 'boss'; this.hp = 150;
        this.currentGun = WEAPONS[Math.floor(Math.random()*WEAPONS.length)]; 
        this.shootCooldown = 60; this.isDeadState = false; this.jumpCooldown = 0;
    }
    
    update(map) {
        if (this.isDeadState) { this.vy += GRAVITY; this.y += this.vy; return; }
        
        if (this.jumpCooldown > 0) this.jumpCooldown--;
        if (this.shootCooldown > 0) this.shootCooldown--; 

        if (game.player && !game.player.isDeadState) { 
            let dist = game.player.x - this.x;
            let absDist = Math.abs(dist);
            this.facingRight = dist > 0; 
            
            let currentGun = this.currentGun;
            let targetDist = 120; 
            if (currentGun) {
                if (currentGun.name === 'Shotgun') targetDist = 50; 
                if (currentGun.name === 'Sniper') targetDist = 180; 
            }
            
            if (absDist > targetDist + 30) this.vx = this.facingRight ? 1.4 : -1.4; 
            else if (absDist < targetDist - 30) this.vx = this.facingRight ? -1.4 : 1.4; 
            else {
                if (Math.random() < 0.05) this.vx = Math.random() > 0.5 ? 1 : -1; 
            }

            if (this.onGround && this.jumpCooldown <= 0) {
                let playerAbove = game.player.y < this.y - 32;
                let stuck = (Math.abs(this.vx) < 0.1 && absDist > 40); 
                if ((playerAbove && absDist < 80 && Math.random() < 0.1) || stuck) {
                    this.vy = -6; 
                    this.jumpCooldown = 40;
                }
            }

            if (this.shootCooldown <= 0 && currentGun) {
                let t = absDist / currentGun.speed; 
                let predY = game.player.y + game.player.vy * t + 0.5 * GRAVITY * t * t; 
                let groundLevel = 13 * TILE_SIZE - 16;
                if (predY > groundLevel) predY = groundLevel; 

                let myCenter = this.y + 16;
                let pCurrentCenter = game.player.y + 8;
                let pPredCenter = predY + 8;

                if (Math.abs(myCenter - pCurrentCenter) < 24 || Math.abs(myCenter - pPredCenter) < 24 || Math.random() < 0.05) {
                    game.fireWeapon(this, false);
                }
            }
        }
        
        this.applyPhysics(map);
    }
    
    onWallHit(tile, oldVx) { 
        this.vx = 0; 
        if (this.onGround && this.jumpCooldown <= 0) { this.vy = -6.5; this.jumpCooldown = 30; } 
    }
    
    die() { this.isDeadState = true; this.vy = -5; this.vx = 0; playSound('kick'); }
    draw(ctx) {
        ctx.save(); ctx.translate(Math.floor(this.x + this.w / 2), Math.floor(this.y));
        ctx.scale(this.facingRight ? 2 : -2, 2); ctx.drawImage(Sprites.bossTurtle, -8, 0); ctx.restore();
    }
}

class Goomba extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'goomba'; this.vx = -0.5; this.animTimer = 0; this.state = 'walk'; }
    update(map) {
        if (this.state === 'star_dead') { this.vy += GRAVITY; this.y += this.vy; this.x += this.vx; if (this.y > 240) this.dead = true; return; }
        if (this.state === 'squished') { this.deathTimer--; if (this.deathTimer <= 0) this.dead = true; return; }
        this.applyPhysics(map); this.animTimer += 0.1; if (this.x < game.cameraX - 64) this.dead = true; 
    }
    onWallHit(tile, oldVx) { this.vx = oldVx > 0 ? -0.5 : 0.5; }
    squish() { this.state = 'squished'; this.vx = 0; this.deathTimer = 30; }
    draw(ctx) {
        let sp = Sprites.goomba1; if (this.state === 'squished') sp = Sprites.goombaSquished; else if (Math.floor(this.animTimer) % 2 === 0) sp = Sprites.goomba2;
        ctx.save(); ctx.translate(this.x+8, this.y+8); if (this.state === 'star_dead') ctx.scale(1, -1);
        ctx.drawImage(sp, -8, -8); ctx.restore();
    }
}

class Koopa extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'koopa'; this.vx = -0.5; this.animTimer = 0; this.state = 'walk'; }
    update(map, entities) {
        if (this.state === 'star_dead') { this.vy += GRAVITY; this.y += this.vy; this.x += this.vx; if (this.y > 240) this.dead = true; return; }
        this.applyPhysics(map); this.animTimer += 0.1;
        if (this.state === 'shell_slide') {
            for (let e of entities) {
                if (e === this || e.dead || e.type === 'player' || e.type === 'coin_item' || e.type === 'mushroom' || e.type === 'star' || e.type === 'golden_mario') continue;
                if (this.intersects(e)) { e.dieFromStar(); game.gainReward(200, e.x, e.y); }
            }
        }
        if (this.x < game.cameraX - 64) this.dead = true; 
    }
    onWallHit(tile, oldVx) { 
        if (this.state === 'shell_slide') { this.vx = oldVx > 0 ? -3.5 : 3.5; playSound('bump'); } 
        else { this.vx = oldVx > 0 ? -0.5 : 0.5; this.facingRight = this.vx > 0; }
    }
    squish() { if (this.state === 'walk' || this.state === 'shell_slide') { this.state = 'shell_idle'; this.vx = 0; } }
    draw(ctx) {
        let sp = Sprites.koopa1; if (this.state === 'shell_idle' || this.state === 'shell_slide') sp = Sprites.shell; else if (Math.floor(this.animTimer) % 2 === 0) sp = Sprites.koopa2;
        ctx.save(); ctx.translate(this.x+8, this.y+8);
        if (this.state === 'star_dead') ctx.scale(1, -1); else if (this.state === 'walk' && this.vx > 0) ctx.scale(-1, 1);
        ctx.drawImage(sp, -8, -8); ctx.restore();
    }
}

class GoldenMario extends Entity {
    constructor(x, y) { super(x, y, 12, 16); this.type = 'golden_mario'; this.walkDir = Math.random() < 0.5 ? -1 : 1; this.walkTimer = 60; this.animTimer = 0; }
    update(map) {
        this.animTimer += 0.1;
        this.walkTimer--;
        if (this.walkTimer <= 0) {
            this.walkTimer = 40 + Math.floor(Math.random() * 80);
            if (Math.random() < 0.65) this.walkDir *= -1;
        }
        this.vx = this.walkDir * 0.35;
        this.facingRight = this.vx > 0;
        this.applyPhysics(map);
        if (this.onGround && Math.random() < 0.004) this.vy = -3.4;
        if (this.x < game.cameraX - 64) this.dead = true;
    }
    onWallHit(tile, oldVx) { this.walkDir = oldVx > 0 ? -1 : 1; this.vx = this.walkDir * 0.35; }
    squish() {}
    dieFromStar() {}
    draw(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(this.x + 6, this.y + this.h + 2, 6, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.filter = 'hue-rotate(35deg) saturate(250%)';
        const sp = Math.abs(this.vx) > 0.05 ? ((Math.floor(this.animTimer) % 2 === 0) ? Sprites.marioRun1 : Sprites.marioRun2) : Sprites.marioIdle;
        if (!this.facingRight) { ctx.translate(this.x + 6, this.y); ctx.scale(-1, 1); ctx.drawImage(sp, -6, 0); }
        else ctx.drawImage(sp, this.x, this.y);
        ctx.restore();
    }
}

class ThrownBird extends Entity {
    constructor(x, y, vx, vy) { super(x, y, 10, 10); this.type = 'thrown_bird'; this.vx = vx; this.vy = vy; this.life = 180; }
    update(map, entities) {
        this.x += this.vx; this.y += this.vy; this.life--;
        if (this.life <= 0 || this.x < -64 || this.x > map.columns.length * TILE_SIZE + 64 || this.y < -32 || this.y > 300) { this.dead = true; return; }
        for (let e of entities) {
            if (e === this || e.dead || e.type === 'player' || e.type === 'golden_mario' || e.type === 'coin_item' || e.type === 'mushroom' || e.type === 'star') continue;
            if (this.intersects(e)) { if (e.dieFromStar) e.dieFromStar(); else e.dead = true; this.dead = true; return; }
        }
        const tiles = map.getIntersectingTiles({ x: this.x, y: this.y, w: this.w, h: this.h });
        for (let t of tiles) {
            if (t.type === 'qblock' || t.type === 'brick') { map.hitBlock(t.x, t.y, true); this.dead = true; return; }
            if (t.solid) { this.dead = true; return; }
        }
    }
    draw(ctx) { ctx.drawImage(Sprites.bird1, this.x - 3, this.y - 3); }
}

class Bird extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'bird'; this.vx = -1.8; this.vy = 0; this.animTimer = 0; this.state = 'fly'; }
    update(map) {
        if (this.state === 'squished' || this.state === 'star_dead') {
            this.vy += GRAVITY; this.y += this.vy; this.x += this.state === 'star_dead' ? this.vx : 0;
            if (this.y > 240) this.dead = true; return;
        }
        this.x += this.vx; this.animTimer += 0.1; if (this.x < game.cameraX - 100) this.dead = true; 
    }
    squish() { this.state = 'squished'; this.vy = -1; this.vx = 0; }
    draw(ctx) {
        let sp = (Math.floor(this.animTimer) % 2 === 0) ? Sprites.bird1 : Sprites.bird2;
        ctx.save(); ctx.translate(this.x + 8, this.y + 8);
        if (this.state === 'squished' || this.state === 'star_dead') ctx.scale(1, -1); 
        ctx.drawImage(sp, -8, -8); ctx.restore();
    }
}

class Mushroom extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'mushroom'; this.vx = 1; this.spawning = true; this.spawnY = y - 16; this.vy = -0.5; }
    update(map) {
        if (this.spawning) { this.y += this.vy; if (this.y <= this.spawnY) { this.y = this.spawnY; this.spawning = false; this.vy = 0; } return; }
        this.applyPhysics(map);
    }
    onWallHit(tile, oldVx) { this.vx = oldVx > 0 ? -1 : 1; }
    draw(ctx) { ctx.drawImage(Sprites.mushroom, this.x, this.y); }
}

class Star extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'star'; this.vx = 1.5; this.spawning = true; this.spawnY = y - 16; this.vy = -1; }
    update(map) {
        if (this.spawning) { this.y += this.vy; if (this.y <= this.spawnY) { this.y = this.spawnY; this.spawning = false; this.vy = 0; } return; }
        this.applyPhysics(map);
    }
    onWallHit(tile, oldVx) { this.vx = oldVx > 0 ? -1.5 : 1.5; }
    onCeilingHit() { this.vy = 0; }
    applyPhysics(map) {
        this.vy += GRAVITY; if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
        this.y += this.vy; this.onGround = false;
        let yTiles = map.getIntersectingTiles({ x: this.x + 2, y: this.y, w: this.w - 4, h: this.h });
        for (let t of yTiles) {
            if (t.solid) {
                if (this.vy > 0) { this.y = t.y * TILE_SIZE - this.h; this.vy = -4.5; } 
                else if (this.vy < 0) { this.y = t.y * TILE_SIZE + TILE_SIZE; this.vy = 0; } break; 
            }
        }
        this.x += this.vx;
        let xTiles = map.getIntersectingTiles({ x: this.x, y: this.y + 2, w: this.w, h: this.h - 4 });
        for (let t of xTiles) {
            if (t.solid) {
                let oldVx = this.vx; 
                if (this.vx > 0) { this.x = t.x * TILE_SIZE - this.w; this.vx = 0; }
                else if (this.vx < 0) { this.x = t.x * TILE_SIZE + TILE_SIZE; this.vx = 0; }
                this.onWallHit(t, oldVx); break;
            }
        }
    }
    draw(ctx) { ctx.save(); ctx.filter = `hue-rotate(${Date.now() % 360}deg)`; ctx.drawImage(Sprites.star, this.x, this.y); ctx.restore(); }
}

class CoinItem extends Entity {
    constructor(x, y) { super(x, y, 16, 16); this.type = 'coin_item'; this.animTimer = 0; }
    update() { this.animTimer += 0.1; }
    draw(ctx) { ctx.save(); ctx.translate(this.x + 8, this.y + 8); ctx.scale(Math.abs(Math.sin(this.animTimer)), 1); ctx.drawImage(Sprites.coin, -8, -8); ctx.restore(); }
}

class ScoreParticle {
    constructor(x, y, text, color = 'white') { this.x = x; this.y = y; this.text = text; this.color = color; this.vy = -2; this.life = 40; }
    update() { this.y += this.vy; this.life--; if (this.life <= 0) this.dead = true; }
    draw(ctx) { ctx.fillStyle = this.color; ctx.font = 'bold 12px Courier New'; ctx.fillText(this.text, this.x, this.y); }
}
class BrickDebris {
    constructor(x, y, vx, vy) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.life = 60; }
    update() { this.vy += GRAVITY; this.x += this.vx; this.y += this.vy; this.life--; if (this.life <= 0) this.dead = true; }
    draw(ctx) { ctx.fillStyle = '#c84c0c'; ctx.fillRect(this.x, this.y, 8, 8); }
}

class ShootoutArena {
    constructor(gameInst) {
        this.game = gameInst; this.rows = 15; this.cols = 40; this.columns = [];
        
        for(let x=0; x<this.cols; x++) {
            let col = new Array(this.rows).fill(null);
            
            // 地面与天花板边界
            col[13] = { x, y: 13, type: 'usedblock', solid: true, bounceY: 0 };
            col[14] = { x, y: 14, type: 'usedblock', solid: true, bounceY: 0 };
            
            // 两侧空气墙边界
            if (x===0 || x===this.cols-1) { for(let y=0; y<15; y++) col[y] = { x, y, type: 'usedblock', solid: true, bounceY: 0 }; }
            
            // 立体高低跳台
            if (x >= 4 && x <= 10) col[9] = { x, y: 9, type: 'brick', solid: true, bounceY: 0 }; // 左跳台
            if (x >= 29 && x <= 35) col[9] = { x, y: 9, type: 'brick', solid: true, bounceY: 0 }; // 右跳台
            if (x >= 15 && x <= 24) col[5] = { x, y: 5, type: 'brick', solid: true, bounceY: 0 }; // 中央制高点
            
            // 地面掩体 (可挡子弹)
            if (x === 13 || x === 26) {
                col[11] = { x, y: 11, type: 'usedblock', solid: true, bounceY: 0 };
                col[12] = { x, y: 12, type: 'usedblock', solid: true, bounceY: 0 };
            }

            this.columns[x] = col;
        }
    }
    getIntersectingTiles(rect, shrinkX=0, shrinkY=0) {
        let tiles = [];
        let startX = Math.max(0, Math.floor((rect.x + shrinkX) / TILE_SIZE));
        let endX = Math.min(this.cols-1, Math.floor((rect.x + rect.w - shrinkX - 0.001) / TILE_SIZE));
        let startY = Math.max(0, Math.floor((rect.y + shrinkY) / TILE_SIZE));
        let endY = Math.min(this.rows - 1, Math.floor((rect.y + rect.h - shrinkY - 0.001) / TILE_SIZE));
        for (let x = startX; x <= endX; x++) {
            if (!this.columns[x]) continue;
            for (let y = startY; y <= endY; y++) if (this.columns[x][y]) tiles.push(this.columns[x][y]);
        }
        return tiles;
    }
    draw(ctx, cameraX) {
        let startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
        let endCol = startCol + Math.ceil(canvas.width / TILE_SIZE) + 1;
        for (let x = startCol; x <= endCol; x++) {
            if (!this.columns[x]) continue;
            for (let y = 0; y < this.rows; y++) {
                let t = this.columns[x][y];
                if (t) {
                    let sp = t.type === 'brick' ? Sprites.brick : Sprites.usedBlock;
                    ctx.drawImage(sp, x * TILE_SIZE, y * TILE_SIZE);
                }
            }
        }
    }
}

class InfiniteMap {
    constructor(gameInst) {
        this.game = gameInst; this.columns = []; this.bgColumns = []; this.rows = 15;
        this.animTimer = 0; this.lastGenX = 0; this.state = 'safe_zone'; this.stateTimer = 20; 
        this.groundY = 11; this.pipeHeight = 2; this.blocksSpawned = 0; this.isGoldenPipe = false;
    }
    buildPipe(col, x, isLeft, isGolden = false) {
        let topY = this.groundY - this.pipeHeight;
        let pTL = isGolden ? 'gPipeTL' : 'pipeTL'; let pTR = isGolden ? 'gPipeTR' : 'pipeTR';
        let pL = isGolden ? 'gPipeL' : 'pipeL'; let pR = isGolden ? 'gPipeR' : 'pipeR';
        col[topY] = { x, y: topY, type: isLeft ? pTL : pTR, solid: true, bounceY: 0 };
        for (let py = topY + 1; py < this.groundY; py++) col[py] = { x, y: py, type: isLeft ? pL : pR, solid: true, bounceY: 0 };
    }
    generateColumn() {
        let x = this.lastGenX++; let col = new Array(this.rows).fill(null); let bgCol = new Array(this.rows).fill(null);
        if (Math.random() < 0.05) bgCol[Math.floor(Math.random() * 4) + 1] = 'cloud';
        
        if (this.state === 'ground' && Math.random() < 0.05) {
            let by = Math.random() < 0.5 ? 4 : 7;
            for(let i=0; i<3; i++) this.game.entities.push(new CoinItem((x+i)*TILE_SIZE, by*TILE_SIZE));
        }

        if (this.state === 'safe_zone') {
            this.buildGround(col, x, this.groundY); this.stateTimer--;
            if (this.stateTimer === 10) col[6] = { x, y: 6, type: 'qblock', solid: true, bounceY: 0, item: 'mushroom' };
            if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = 5; }
        } else if (this.state === 'ground') {
            this.buildGround(col, x, this.groundY); this.stateTimer--;
            if (Math.random() < 0.25) {
                let by = Math.random() < 0.5 ? 6 : 2;  let type = Math.random() < 0.4 ? 'qblock' : 'brick';
                let item = null;
                if (type === 'qblock') {
                    this.blocksSpawned++;
                    let isBig = this.game.player && this.game.player.isBig;
                    if (isBig) {
                        if (Math.random() < 0.5) item = 'star'; else item = Math.random() < 0.5 ? 'coin' : 'mushroom';
                    } else {
                        if (Math.random() < 0.6) item = 'mushroom'; else item = Math.random() < 0.5 ? 'coin' : null;
                    }
                }
                col[by] = { x, y: by, type, solid: true, bounceY: 0, item };
            }
            if (this.stateTimer <= 0) {
                let r = Math.random();
                if (r < 0.2) { this.state = 'pit'; this.stateTimer = Math.floor(Math.random() * 3) + 2; }
                else if (r < 0.4) { 
                    this.state = 'pipe_start'; this.stateTimer = 2; 
                    this.pipeHeight = Math.floor(Math.random() * 3) + 2; 
                }
                else if (r < 0.6) {
                    this.state = 'golden_pipe_start'; this.stateTimer = 2;
                    this.pipeHeight = Math.floor(Math.random() * 2) + 2;
                }
                else { this.stateTimer = Math.floor(Math.random() * 6) + 3; }
            } else {
                if (Math.random() < 0.1) {
                    let EnemyClass = Math.random() < 0.4 ? Koopa : Goomba;
                    this.game.entities.push(new EnemyClass(x * TILE_SIZE, (this.groundY - 1) * TILE_SIZE));
                }
                // 平地可随机刷出“金色马里奥”（友好生物）
                if (Math.random() < 0.035) {
                    this.game.entities.push(new GoldenMario(x * TILE_SIZE, (this.groundY - 1) * TILE_SIZE));
                }
                if (Math.random() < 0.05) {
                    let heights = [this.groundY - 2, this.groundY - 5, this.groundY - 8];
                    let by = heights[Math.floor(Math.random() * heights.length)];
                    this.game.entities.push(new Bird((x + 10) * TILE_SIZE, by * TILE_SIZE));
                }
            }
        } else if (this.state === 'pit') {
            this.stateTimer--; if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = Math.floor(Math.random() * 5) + 3; }
        } else if (this.state === 'pipe_start') {
            this.buildGround(col, x, this.groundY); this.buildPipe(col, x, this.stateTimer === 2, false); this.stateTimer--;
            if (this.stateTimer <= 0) { this.state = 'pipe_gap'; this.stateTimer = Math.floor(Math.random() * 4) + 3; }
        } else if (this.state === 'pipe_gap') {
            this.buildGround(col, x, this.groundY); this.stateTimer--;
            if (this.stateTimer === 2) this.game.entities.push(new Koopa(x * TILE_SIZE, (this.groundY - 1) * TILE_SIZE)); 
            if (this.stateTimer <= 0) { this.state = 'pipe_end'; this.stateTimer = 2; this.pipeHeight = Math.floor(Math.random() * 3) + 2; }
        } else if (this.state === 'pipe_end') {
            this.buildGround(col, x, this.groundY); this.buildPipe(col, x, this.stateTimer === 2, false); this.stateTimer--;
            if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = Math.floor(Math.random() * 5) + 3; }
        } else if (this.state === 'golden_pipe_start') {
            this.buildGround(col, x, this.groundY); this.buildPipe(col, x, this.stateTimer === 2, true); this.stateTimer--;
            if (this.stateTimer <= 0) { this.state = 'ground'; this.stateTimer = Math.floor(Math.random() * 5) + 3; }
        }
        this.columns[x] = col; this.bgColumns[x] = bgCol;
    }

    buildGround(col, x, yStart) { for (let y = yStart; y < this.rows; y++) col[y] = { x, y, type: 'ground', solid: true, bounceY: 0 }; }

    updateGeneration(cameraX) {
        let targetCol = Math.floor((cameraX + canvas.width) / TILE_SIZE) + 2;
        while (this.lastGenX < targetCol) this.generateColumn();
        let cleanupCol = Math.floor(cameraX / TILE_SIZE) - 10;
        if (cleanupCol > 0 && this.columns[cleanupCol]) { delete this.columns[cleanupCol]; delete this.bgColumns[cleanupCol]; }
    }

    getIntersectingTiles(rect, shrinkX=0, shrinkY=0) {
        let tiles = [];
        let startX = Math.max(0, Math.floor((rect.x + shrinkX) / TILE_SIZE));
        let endX = Math.floor((rect.x + rect.w - shrinkX - 0.001) / TILE_SIZE);
        let startY = Math.max(0, Math.floor((rect.y + shrinkY) / TILE_SIZE));
        let endY = Math.min(this.rows - 1, Math.floor((rect.y + rect.h - shrinkY - 0.001) / TILE_SIZE));
        for (let x = startX; x <= endX; x++) {
            if (!this.columns[x]) continue;
            for (let y = startY; y <= endY; y++) if (this.columns[x][y]) tiles.push(this.columns[x][y]);
        }
        return tiles;
    }

    hitBlock(tx, ty, isBig) {
        if (!this.columns[tx] || !this.columns[tx][ty]) return;
        let t = this.columns[tx][ty];
        if (t.type === 'qblock') {
            t.type = 'usedblock'; t.bounceY = -4; playSound('bump');
            if (t.item === 'coin') { this.game.gainReward(100, tx * TILE_SIZE, ty * TILE_SIZE); playSound('coin'); }
            else if (t.item === 'mushroom') { playSound('powerup'); this.game.entities.push(new Mushroom(tx * TILE_SIZE, ty * TILE_SIZE)); }
            else if (t.item === 'star') { playSound('powerup'); this.game.entities.push(new Star(tx * TILE_SIZE, ty * TILE_SIZE)); }
        } else if (t.type === 'brick') {
            if (isBig) {
                this.columns[tx][ty] = null; playSound('bump');
                let px = tx * TILE_SIZE; let py = ty * TILE_SIZE;
                this.game.particles.push(new BrickDebris(px, py, -2, -4)); this.game.particles.push(new BrickDebris(px+8, py, 2, -4));
                this.game.particles.push(new BrickDebris(px, py+8, -2, -2)); this.game.particles.push(new BrickDebris(px+8, py+8, 2, -2));
                this.game.gainReward(50, px, py); 
            } else { t.bounceY = -4; playSound('bump'); }
        }
    }

    drawBg(ctx, cameraX) {
        let startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
        let endCol = startCol + Math.ceil(canvas.width / TILE_SIZE) + 1;
        for (let x = startCol; x <= endCol; x++) {
            if (!this.bgColumns[x]) continue;
            for (let y = 0; y < this.rows; y++) {
                if (this.bgColumns[x][y] === 'cloud') ctx.drawImage(Sprites.cloud, x * TILE_SIZE, y * TILE_SIZE);
            }
        }
    }

    draw(ctx, cameraX) {
        this.animTimer++;
        let startCol = Math.max(0, Math.floor(cameraX / TILE_SIZE));
        let endCol = startCol + Math.ceil(canvas.width / TILE_SIZE) + 1;
        for (let x = startCol; x <= endCol; x++) {
            if (!this.columns[x]) continue;
            for (let y = 0; y < this.rows; y++) {
                let t = this.columns[x][y]; if (!t) continue;
                if (t.bounceY < 0) t.bounceY += 1;
                let drawX = x * TILE_SIZE; let drawY = y * TILE_SIZE + t.bounceY; let sp = null;
                switch(t.type) {
                    case 'ground': sp = Sprites.ground; break; case 'brick': sp = Sprites.brick; break;
                    case 'qblock': sp = (Math.floor(this.animTimer / 15) % 2 === 0) ? Sprites.qBlock : Sprites.usedBlock; break;
                    case 'usedblock': sp = Sprites.usedBlock; break;
                    case 'pipeTL': sp = Sprites.pipeTL; break; case 'pipeTR': sp = Sprites.pipeTR; break;
                    case 'pipeL': sp = Sprites.pipeL; break; case 'pipeR': sp = Sprites.pipeR; break;
                    case 'gPipeTL': sp = Sprites.gPipeTL; break; case 'gPipeTR': sp = Sprites.gPipeTR; break;
                    case 'gPipeL': sp = Sprites.gPipeL; break; case 'gPipeR': sp = Sprites.gPipeR; break;
                }
                if (sp) ctx.drawImage(sp, drawX, drawY);
            }
        }
    }
}

let game = null; let isStarted = false; let lastTime = 0;
function gameLoop(timestamp) {
    if(!isStarted) return;
    let deltaTime = timestamp - lastTime;
    if (deltaTime > 16) { game.update(); game.draw(); lastTime = timestamp; }
    requestAnimationFrame(gameLoop);
}

function startGame() {
    if(isStarted) return; initAudio(); game = new Game();
    refreshItemPanel();
    document.getElementById('start-screen').style.display = 'none';
    isStarted = true; lastTime = performance.now(); requestAnimationFrame(gameLoop);
}
ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
