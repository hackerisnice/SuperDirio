<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 大文件上传工具 (带手机控制台)</title>
    
    <!-- 引入手机端调试工具 Eruda -->
    <script src="https://cdn.bootcdn.net/ajax/libs/eruda/3.0.1/eruda.min.js"></script>
    <script>eruda.init();</script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f6f8fa; color: #24292f; }
        .container { background: white; padding: 30px; border-radius: 6px; border: 1px solid #d0d7de; box-shadow: 0 3px 6px rgba(140,149,159,0.15); }
        h2 { margin-top: 0; color: #0969da; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; }
        input[type="file"] { margin-top: 5px; }
        button { background-color: #2da44e; color: white; border: none; padding: 10px 16px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }
        
        #progress-container { width: 100%; background-color: #e1e4e8; border-radius: 6px; margin-top: 15px; display: none; overflow: hidden; }
        #progress-bar { height: 20px; background-color: #0969da; width: 0%; text-align: center; line-height: 20px; color: white; font-size: 12px; transition: width 0.2s ease; }
        
        #status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; word-break: break-all; }
        .success { background-color: #dafbe1; color: #1a7f37; border: 1px solid #a3e635; }
        .error { background-color: #ffebe9; color: #cf222e; border: 1px solid #ff8182; }
        .info { background-color: #ddf4ff; color: #0969da; border: 1px solid #54aeff; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 大文件专属上传通道</h2>
    <p style="font-size: 13px; color: #57606a;">手机端测试版。页面右下角的齿轮图标是控制台，遇到错误可点开查看网络详情。</p>
    
    <div class="form-group">
        <label for="token">GitHub Token:</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="form-group">
        <label for="owner">仓库拥有者 (用户名):</label>
        <input type="text" id="owner" placeholder="例如: octocat">
    </div>
    <div class="form-group">
        <label for="repo">仓库名称:</label>
        <input type="text" id="repo" placeholder="例如: Super-Dirio-Ultimate">
    </div>
    <div class="form-group">
        <label for="fileInput">选择大文件:</label>
        <input type="file" id="fileInput">
    </div>

    <button id="uploadBtn" onclick="startLargeUpload()">直接上传二进制文件</button>

    <div id="progress-container">
        <div id="progress-bar">0%</div>
    </div>

    <div id="status"></div>
</div>

<script>
    async function startLargeUpload() {
        const token = document.getElementById('token').value.trim();
        const owner = document.getElementById('owner').value.trim();
        const repo = document.getElementById('repo').value.trim();
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        if (!token || !owner || !repo || fileInput.files.length === 0) {
            showStatus('请填写完整的配置信息并选择文件！', 'error');
            return;
        }

        const file = fileInput.files[0];
        const tagName = `upload-${Date.now()}`; 

        uploadBtn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        progressBar.innerText = '0%';
        
        try {
            uploadBtn.innerText = '正在初始化传输通道...';
            showStatus('正在 GitHub 上创建 Release 节点...', 'info');
            console.log("准备发送创建 Release 请求...");
            
            const createReleaseUrl = `https://api.github.com/repos/${owner}/${repo}/releases`;
            const releaseRes = await fetch(createReleaseUrl, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    tag_name: tagName,
                    name: `Web Upload: ${file.name}`,
                    body: "此文件通过大文件网页接口自动上传。",
                    draft: false,
                    prerelease: false
                })
            });

            if (!releaseRes.ok) {
                const errorData = await releaseRes.json();
                console.error("Release 创建失败详情:", errorData);
                throw new Error(errorData.message || '创建 Release 失败');
            }

            const releaseData = await releaseRes.json();
            console.log("Release 节点创建成功:", releaseData);
            
            const rawUploadUrl = releaseData.upload_url.split('{')[0]; 
            const uploadUrl = `${rawUploadUrl}?name=${encodeURIComponent(file.name)}`;

            uploadBtn.innerText = `正在高速上传: ${file.name}...`;
            showStatus('通道建立成功，正在推送文件数据...', 'info');
            console.log("准备上传真实二进制文件到:", uploadUrl);

            const uploadData = await uploadBinaryWithProgress(uploadUrl, token, file, (percent) => {
                progressBar.style.width = percent + '%';
                progressBar.innerText = percent + '%';
            });

            showStatus(`✅ 大文件上传成功！<br><br><b>直接下载链接：</b><br><a href="${uploadData.browser_download_url}" target="_blank">${uploadData.browser_download_url}</a>`, 'success');
            progressBar.innerText = '上传完成!';
            console.log("上传完毕，返回数据:", uploadData);

        } catch (error) {
            // 在控制台打印完整的错误堆栈
            console.error("捕获到核心错误:", error);
            
            // 手机强制弹窗提示详细错误（带行号等信息）
            alert("底层报错拦截:\n" + (error.stack || error.message));

            showStatus(`❌ 发生错误: ${error.message}`, 'error');
            progressBar.style.backgroundColor = '#cf222e';
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.innerText = '开始上传二进制文件';
        }
    }

    function uploadBinaryWithProgress(url, token, file, onProgress) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
            xhr.setRequestHeader('Authorization', `Bearer ${token}`);
            xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    onProgress(percentComplete);
                }
            };

            xhr.onload = function() {
                let response;
                try { response = JSON.parse(xhr.responseText); } 
                catch(e) { response = { message: "解析响应失败", raw: xhr.responseText }; }

                if (xhr.status >= 200 && xhr.status < 300) {
                    resolve(response);
                } else {
                    console.error("上传 HTTP 状态码异常:", xhr.status, response);
                    reject(new Error(response.message || `HTTP 错误码: ${xhr.status}`));
                }
            };

            xhr.onerror = function(e) {
                console.error("XHR 请求级严重错误 (onerror触发):", e);
                reject(new Error('网络中断或请求被拒绝。请点开右下角齿轮查看 Console 红字。'));
            };

            xhr.send(file);
        });
    }

    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = message;
        statusDiv.className = type;
    }
</script>

</body>
</html>
